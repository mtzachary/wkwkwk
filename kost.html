<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KostKu SuperApp — Sistem Manajemen Kos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --canvas:#F3F6F3; --surface:#FFFFFF; --surface-2:#FAFCFA; --surface-3:#F7F9F7;
  --ink:#15211C; --ink-2:#4C5C54; --ink-3:#7C8D84;
  --line:#E0E7E1; --line-2:#EDF1EC;
  --brand:#0F6B52; --brand-2:#0B4F3D; --brand-soft:#E3F0EA; --on-brand:#FFFFFF;
  --amber:#9C6511; --amber-soft:#FAEFDA;
  --red:#AE3A2A; --red-soft:#F9E7E3;
  --blue:#27567F; --blue-soft:#E6EEF6;
  --violet:#57497F; --violet-soft:#ECE9F5;
  --grey-soft:#EDF1EE;
  --radius:14px; --radius-sm:9px; --radius-lg:20px;
  --shadow:0 1px 2px rgba(20,40,32,.05), 0 10px 26px -18px rgba(20,40,32,.35);
  --shadow-lg:0 24px 60px -24px rgba(20,40,32,.35);
  --sidebar-w:248px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --canvas:#0D1411; --surface:#141D19; --surface-2:#18231E; --surface-3:#1A2620;
    --ink:#E8EFEA; --ink-2:#A7BAB0; --ink-3:#7C9187;
    --line:#26332C; --line-2:#1E2A24;
    --brand:#3EA98B; --brand-2:#57C2A3; --brand-soft:#15302A; --on-brand:#06120E;
    --amber:#E0A94A; --amber-soft:#2E2413;
    --red:#E58573; --red-soft:#331914;
    --blue:#7FB0DE; --blue-soft:#15242F;
    --violet:#A99BD6; --violet-soft:#221E31;
    --grey-soft:#1E2A24;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    --shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
  
  }
}
:root[data-theme="dark"]{
  --canvas:#0D1411; --surface:#141D19; --surface-2:#18231E; --surface-3:#1A2620;
  --ink:#E8EFEA; --ink-2:#A7BAB0; --ink-3:#7C9187;
  --line:#26332C; --line-2:#1E2A24;
  --brand:#3EA98B; --brand-2:#57C2A3; --brand-soft:#15302A; --on-brand:#06120E;
  --amber:#E0A94A; --amber-soft:#2E2413;
  --red:#E58573; --red-soft:#331914;
  --blue:#7FB0DE; --blue-soft:#15242F;
  --violet:#A99BD6; --violet-soft:#221E31;
  --grey-soft:#1E2A24;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  --shadow-lg:0 24px 60px -24px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); background:var(--canvas); color:var(--ink);
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1;
}
h1,h2,h3,h4{margin:0; line-height:1.2; font-weight:700; letter-spacing:-.015em}
h1{font-size:1.5rem} h2{font-size:1.15rem} h3{font-size:1rem} h4{font-size:.875rem}
p{margin:0 0 .6em}
a{color:var(--brand)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important; transition:none!important}}
img{max-width:100%}
.hidden{display:none!important}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.small{font-size:.8125rem}
.tiny{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}
.right{text-align:right}
.nowrap{white-space:nowrap}
.strong{font-weight:700}
.row{display:flex; align-items:center; gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:4px}
.grow{flex:1 1 auto; min-width:0}
.mt{margin-top:18px} .mt-s{margin-top:10px} .mb{margin-bottom:14px}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100vh}
.sidebar{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px 14px}
.brand-mark{
  width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--on-brand);
  display:grid;place-items:center;font-weight:800;font-size:.95rem;letter-spacing:-.04em;flex:none;
}
.brand-name{font-weight:800; letter-spacing:-.02em; font-size:1.02rem}
.brand-sub{font-size:.7rem; color:var(--ink-3); margin-top:-2px}
.prop-switch{margin:4px 12px 10px; padding:9px 11px; border:1px solid var(--line); border-radius:var(--radius-sm); background:var(--surface-3); width:calc(100% - 24px); text-align:left; cursor:pointer; display:flex; gap:9px; align-items:center}
.prop-switch:hover{border-color:var(--brand)}
.nav{padding:4px 12px 12px; overflow-y:auto; flex:1}
.nav-label{font-size:.7rem; font-weight:700; color:var(--ink-3); padding:14px 10px 6px; letter-spacing:.02em}
.nav a{
  display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:var(--radius-sm);
  color:var(--ink-2); text-decoration:none; font-weight:600; font-size:.875rem; margin-bottom:1px;
}
.nav a:hover{background:var(--surface-3); color:var(--ink)}
.nav a.active{background:var(--brand-soft); color:var(--brand); }
.nav a .ico{flex:none; opacity:.9}
.nav a .pill{margin-left:auto; background:var(--red); color:#fff; font-size:.68rem; font-weight:700; padding:1px 6px; border-radius:99px; min-width:19px; text-align:center}
:root[data-theme="dark"] .nav a .pill{color:#1a0d0a}
.sidebar-foot{border-top:1px solid var(--line); padding:12px}
.who{display:flex; gap:10px; align-items:center; padding:6px}
.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--canvas) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 26px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.page{padding:26px; max-width:1360px; width:100%}
.page-head{margin-bottom:20px}
.page-head .sub{color:var(--ink-2); font-size:.9rem; margin-top:3px}
.hamburger{display:none}
.scrim{display:none}
@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed; left:0; top:0; bottom:0; width:270px; transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block; position:fixed; inset:0; background:rgba(8,20,15,.45); z-index:35}
  .hamburger{display:inline-grid}
  .topbar{padding:10px 14px}
  .page{padding:16px 14px 40px}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:8px 14px; border-radius:var(--radius-sm); font-weight:600; font-size:.875rem;
  transition:background .12s ease, border-color .12s ease; white-space:nowrap;
}
.btn:hover{background:var(--surface-3); border-color:var(--ink-3)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2); border-color:var(--brand-2)}
.btn.danger{background:var(--red-soft); border-color:transparent; color:var(--red)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-3); color:var(--ink)}
.btn.sm{padding:5px 10px; font-size:.8rem; border-radius:7px}
.btn.icon{padding:8px; border-radius:9px}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn-group{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- Cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-head{padding:15px 18px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.card-body{padding:18px}
.card-body.tight{padding:12px 14px}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ---------- Attention panel (dashboard hero) ---------- */
.attention{
  background:var(--brand); color:var(--on-brand); border-radius:var(--radius-lg);
  padding:22px 24px; box-shadow:var(--shadow);
}
:root[data-theme="dark"] .attention{background:linear-gradient(160deg,#0F3B2F,#10322A); border:1px solid var(--line)}
.attention h2{font-size:1.25rem}
.attention .today{font-size:.8rem; opacity:.82; font-weight:600}
.att-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:10px; margin-top:16px}
.att-item{
  display:flex; gap:11px; align-items:flex-start; text-align:left; width:100%;
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); color:inherit;
  padding:11px 13px; border-radius:11px; cursor:pointer; font:inherit;
}
.att-item:hover{background:rgba(255,255,255,.2)}
.att-item .n{font-size:1.25rem; font-weight:800; line-height:1.1}
.att-item .t{font-size:.8rem; opacity:.9; font-weight:600}
.att-empty{background:rgba(255,255,255,.12); border-radius:11px; padding:14px; margin-top:14px; font-size:.875rem}

/* ---------- Stats ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 15px}
.stat .k{display:flex; align-items:center; gap:7px; color:var(--ink-3); font-size:.75rem; font-weight:700}
.stat .v{font-size:1.4rem; font-weight:800; letter-spacing:-.03em; margin-top:7px; line-height:1.1}
.stat .d{font-size:.75rem; color:var(--ink-2); margin-top:3px}
.stat.warn{border-color:color-mix(in srgb, var(--amber) 45%, var(--line))}
.stat.bad{border-color:color-mix(in srgb, var(--red) 45%, var(--line))}

/* ---------- Badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:.75rem; font-weight:700; background:var(--grey-soft); color:var(--ink-2); white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:99px;background:currentColor}
.badge.ok{background:var(--brand-soft); color:var(--brand)}
.badge.warn{background:var(--amber-soft); color:var(--amber)}
.badge.bad{background:var(--red-soft); color:var(--red)}
.badge.info{background:var(--blue-soft); color:var(--blue)}
.badge.vio{background:var(--violet-soft); color:var(--violet)}
.chip{display:inline-flex; align-items:center; gap:6px; padding:3px 9px; border-radius:7px; background:var(--surface-3); border:1px solid var(--line); font-size:.75rem; font-weight:600; color:var(--ink-2)}

/* ---------- Tables ---------- */
.toolbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.search{position:relative; flex:1 1 230px; min-width:180px; max-width:360px}
.search input{width:100%; padding:8px 12px 8px 34px}
.search .ico{position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-3)}
input,select,textarea{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:8px 11px; width:100%; font-size:.875rem;
}
select{cursor:pointer; appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%); background-position:calc(100% - 15px) 50%, calc(100% - 10px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
textarea{min-height:82px; resize:vertical}
.sel-auto{width:auto; min-width:130px}
.table-wrap{overflow-x:auto; border-radius:var(--radius); border:1px solid var(--line); background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:.8625rem}
thead th{
  text-align:left; font-size:.72rem; font-weight:700; color:var(--ink-3); padding:11px 14px;
  background:var(--surface-3); border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0;
}
thead th.sortable{cursor:pointer; user-select:none}
thead th.sortable:hover{color:var(--ink)}
tbody td{padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:var(--surface-3)}
.pager{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px; border-top:1px solid var(--line); flex-wrap:wrap; font-size:.8125rem; color:var(--ink-2)}
.empty{padding:40px 20px; text-align:center; color:var(--ink-2)}
.empty h3{margin-bottom:6px}

/* ---------- Avatar ---------- */
.av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;background:var(--brand-soft);color:var(--brand)}
.av.lg{width:64px;height:64px;font-size:1.3rem}
.av.sm{width:26px;height:26px;font-size:.68rem}

/* ---------- Room cards ---------- */
.rooms{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.room{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; cursor:pointer; text-align:left; width:100%; font:inherit; color:inherit; border-left:4px solid var(--ink-3)}
.room:hover{border-color:var(--ink-3); box-shadow:var(--shadow)}
.room.s-occupied{border-left-color:var(--brand)}
.room.s-available{border-left-color:var(--blue)}
.room.s-reserved{border-left-color:var(--violet)}
.room.s-maintenance{border-left-color:var(--amber)}
.room .no{font-size:1.1rem; font-weight:800; letter-spacing:-.02em}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); overflow-x:auto; margin-bottom:16px}
.tabs button{background:none; border:none; padding:9px 13px; font-weight:600; font-size:.85rem; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap}
.tabs button.active{color:var(--brand); border-bottom-color:var(--brand)}
.segmented{display:inline-flex; background:var(--surface-3); border:1px solid var(--line); border-radius:var(--radius-sm); padding:2px}
.segmented button{background:none;border:none;padding:6px 12px;border-radius:7px;font-size:.8rem;font-weight:600;color:var(--ink-2);cursor:pointer}
.segmented button.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}

/* ---------- Modal ---------- */
.modal-scrim{position:fixed; inset:0; background:rgba(8,20,15,.5); z-index:80; display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; overflow-y:auto}
.modal{background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:640px; box-shadow:var(--shadow-lg); border:1px solid var(--line); margin:auto}
.modal.wide{max-width:900px}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line-2); display:flex; align-items:flex-start; justify-content:space-between; gap:12px; position:sticky; top:0; background:var(--surface); border-radius:var(--radius-lg) var(--radius-lg) 0 0; z-index:2}
.modal-body{padding:22px}
.modal-foot{padding:14px 22px; border-top:1px solid var(--line-2); display:flex; gap:9px; justify-content:flex-end; flex-wrap:wrap; position:sticky; bottom:0; background:var(--surface); border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* ---------- Forms ---------- */
.form-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
label.field{display:block}
label.field > span{display:block; font-size:.78rem; font-weight:700; color:var(--ink-2); margin-bottom:5px}
.hint{font-size:.75rem; color:var(--ink-3); margin-top:4px}
.err{color:var(--red); font-size:.78rem; margin-top:5px; font-weight:600}
fieldset{border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; margin:0}
legend{font-size:.78rem; font-weight:700; color:var(--ink-2); padding:0 6px}

/* ---------- Definition list ---------- */
.dl{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px}
.dl > div{min-width:0}
.dl dt{font-size:.73rem; color:var(--ink-3); font-weight:700; margin-bottom:2px}
.dl dd{margin:0; font-weight:600; font-size:.9rem; overflow-wrap:anywhere}

/* ---------- Timeline / notifications ---------- */
.timeline{display:flex; flex-direction:column}
.tl-item{display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line-2)}
.tl-item:last-child{border-bottom:none}
.tl-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.tl-item.unread{background:var(--surface-3); border-radius:9px}
.notif-panel{position:absolute; right:0; top:46px; width:min(380px,92vw); max-height:70vh; overflow-y:auto; z-index:60}

/* ---------- Progress ---------- */
.bar{height:7px; background:var(--grey-soft); border-radius:99px; overflow:hidden}
.bar > i{display:block; height:100%; background:var(--brand); border-radius:99px}
.bar > i.warn{background:var(--amber)} .bar > i.bad{background:var(--red)}

/* ---------- Toast ---------- */
.toasts{position:fixed; right:18px; bottom:18px; z-index:200; display:flex; flex-direction:column; gap:9px; max-width:min(380px,92vw)}
.toast{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brand); border-radius:11px; padding:12px 14px; box-shadow:var(--shadow-lg); font-size:.85rem; display:flex; gap:10px; align-items:flex-start}
.toast.bad{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)}

/* ---------- Charts ---------- */
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.75rem; color:var(--ink-2); font-weight:600; margin-top:10px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px}

/* ---------- Kanban ---------- */
.kanban{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px}
.kcol{background:var(--surface-3); border:1px solid var(--line); border-radius:var(--radius); padding:10px; min-height:100px}
.kcol h4{font-size:.78rem; color:var(--ink-2); padding:2px 4px 8px; display:flex; justify-content:space-between}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px; margin-bottom:8px; cursor:pointer; width:100%; text-align:left; font:inherit; color:inherit; display:block}
.kcard:hover{border-color:var(--brand)}

/* ---------- Login ---------- */
.auth{min-height:100vh; display:grid; grid-template-columns:1.05fr .95fr}
.auth-art{background:var(--brand); color:var(--on-brand); padding:48px; display:flex; flex-direction:column; justify-content:space-between}
.auth-art h1{font-size:2.3rem; letter-spacing:-.03em; max-width:12ch}
.auth-form{display:grid; place-items:center; padding:32px 24px; background:var(--surface)}
.auth-card{width:100%; max-width:400px}
.role-pick{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0}
.role-pick button{padding:13px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:var(--surface); cursor:pointer; text-align:left; font:inherit; color:inherit}
.role-pick button.active{border-color:var(--brand); background:var(--brand-soft)}
.auth-feature{display:flex; gap:12px; align-items:flex-start; margin-top:14px; font-size:.875rem; opacity:.92}
@media (max-width:860px){.auth{grid-template-columns:1fr} .auth-art{padding:30px 22px; min-height:auto} .auth-art h1{font-size:1.7rem} .auth-art .art-list{display:none}}

/* ---------- Misc ---------- */
.photo-slot{aspect-ratio:4/3; border-radius:10px; background:var(--surface-3); border:1px dashed var(--line); display:grid; place-items:center; color:var(--ink-3); font-size:.75rem; font-weight:600; text-align:center; padding:8px}
.stars{display:inline-flex; gap:2px; color:var(--amber)}
.starbtn{background:none;border:none;cursor:pointer;padding:2px;color:var(--line);font-size:1.5rem;line-height:1}
.starbtn.on{color:var(--amber)}
.qr{width:170px;height:170px;border-radius:12px;background:
  conic-gradient(from 0deg, var(--ink) 25%, transparent 0 50%, var(--ink) 0 75%, transparent 0);
  background-size:14px 14px; border:8px solid var(--surface); box-shadow:0 0 0 1px var(--line); margin:0 auto}
.divider{height:1px; background:var(--line-2); margin:16px 0}

const NOW = new Date(2026, 8, 17); // 17 September 2026
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BULAN_S = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

const $ = (sel, el) => (el || document).querySelector(sel);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function rp(n) {
  const v = Math.round(Number(n) || 0);
  return 'Rp' + v.toLocaleString('id-ID');
}
function rpShort(n) {
  const v = Math.round(Number(n) || 0);
  if (Math.abs(v) >= 1e9) return 'Rp' + (v / 1e9).toFixed(1).replace('.', ',') + ' M';
  if (Math.abs(v) >= 1e6) return 'Rp' + (v / 1e6).toFixed(1).replace('.', ',') + ' jt';
  if (Math.abs(v) >= 1e3) return 'Rp' + Math.round(v / 1e3) + ' rb';
  return 'Rp' + v;
}
function D(s) { return s instanceof Date ? s : new Date(s + 'T00:00:00'); }
function iso(d) {
  const x = d instanceof Date ? d : D(d);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function fdate(s) { if (!s) return '—'; const d = D(s); return d.getDate() + ' ' + BULAN[d.getMonth()] + ' ' + d.getFullYear(); }
function fdateS(s) { if (!s) return '—'; const d = D(s); return d.getDate() + ' ' + BULAN_S[d.getMonth()] + ' ' + d.getFullYear(); }
function fperiod(p) { const [y, m] = p.split('-'); return BULAN[Number(m) - 1] + ' ' + y; }
function periodOf(d) { const x = d instanceof Date ? d : D(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'); }
function addDays(d, n) { const x = new Date(d instanceof Date ? d.getTime() : D(d).getTime()); x.setDate(x.getDate() + n); return x; }
function addMonths(d, n) { const x = new Date(d instanceof Date ? d.getTime() : D(d).getTime()); x.setMonth(x.getMonth() + n); return x; }
function daysBetween(a, b) {
  const A = (a instanceof Date ? a : D(a)), B = (b instanceof Date ? b : D(b));
  return Math.round((B.setHours(0, 0, 0, 0) - A.setHours(0, 0, 0, 0)) / 86400000);
}
function dUntil(s) { return daysBetween(NOW, D(s)); }
function relTime(s) {
  const n = dUntil(s);
  if (n === 0) return 'hari ini';
  if (n === 1) return 'besok';
  if (n === -1) return 'kemarin';
  if (n > 0) return n + ' hari lagi';
  return Math.abs(n) + ' hari lalu';
}
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function uid(prefix) {
  return prefix + '-' + Math.random().toString(36).slice(2, 8).toUpperCase();
}
function sum(arr, f) { return arr.reduce((a, b) => a + (f ? f(b) : b), 0); }
function groupBy(arr, f) {
  const m = {};
  arr.forEach(x => { const k = f(x); (m[k] = m[k] || []).push(x); });
  return m;
}
function sortBy(arr, f, dir) {
  const d = dir === 'desc' ? -1 : 1;
  return arr.slice().sort((a, b) => {
    const A = f(a), B = f(b);
    if (A == null) return 1; if (B == null) return -1;
    if (typeof A === 'number' && typeof B === 'number') return (A - B) * d;
    return String(A).localeCompare(String(B), 'id') * d;
  });
}

      };
      if (per === curP) {

const byId = (arr, id) => arr.find(x => x.id === id) || null;

const roomNo = id => (roomOf(id) || {}).nomor || '—';
const tenantName = id => (tenantOf(id) || {}).nama || '—';
const contractOfTenant = id => DB.contracts.filter(c => c.tenantId === id).sort((a, b) => b.mulai.localeCompare(a.mulai))[0] || null;
const invoicesOfTenant = id => sortBy(DB.invoices.filter(i => i.tenantId === id), i => i.periode, 'desc');
const ticketsOfTenant = id => sortBy(DB.tickets.filter(t => t.tenantId === id), t => t.dilaporkan, 'desc');
const assetsOfRoom = id => DB.assets.filter(a => a.roomId === id);
const outstandingOf = inv => Math.max(0, inv.total + (inv.denda || 0) - (inv.dibayar || 0));
const isOpenTicket = t => TIKET_TERBUKA.includes(t.status);
const stockStatus = it => it.jumlah <= 0 ? 'Habis' : it.jumlah <= it.minimum ? 'Stok Menipis' : 'Tersedia';

  DB.activity = DB.activity.slice(0, 60);
}

/* ---------------- Mesin notifikasi ---------------- */
function buildNotifications(scopeTenantId) {
  const out = [];
  const add = (id, ikon, warna, judul, teks, tanggal, aksi) => out.push({ id, ikon, warna, judul, teks, tanggal, aksi });
  const S = DB.settings;

  DB.invoices.forEach(inv => {
    if (scopeTenantId && inv.tenantId !== scopeTenantId) return;
    const sisa = dUntil(inv.jatuhTempo);
    if (inv.status === 'Lunas') {
      if (inv.tanggalBayar && dUntil(inv.tanggalBayar) > -10)
        add('n-paid-' + inv.id, 'check', 'ok', 'Pembayaran diterima',
          'Tagihan ' + fperiod(inv.periode) + ' kamar ' + roomNo(inv.roomId) + ' sudah lunas — ' + rp(inv.total) + '.', inv.tanggalBayar, { page: 'pembayaran' });
      return;
    }
    if (sisa < 0) {
      add('n-late-' + inv.id, 'alert', 'bad', 'Pembayaran terlambat',
        (scopeTenantId ? 'Tagihan ' : tenantName(inv.tenantId) + ' — kamar ' + roomNo(inv.roomId) + ', tagihan ') + fperiod(inv.periode) + ' telat ' + Math.abs(sisa) + ' hari. Kurang ' + rp(outstandingOf(inv)) + '.',
        inv.jatuhTempo, { page: 'pembayaran' });
    } else if ((sisa === 7 && S.reminder.h7) || (sisa === 3 && S.reminder.h3) || (sisa === 1 && S.reminder.h1) || (sisa === 0 && S.reminder.h0) || sisa <= 7) {
      add('n-due-' + inv.id, 'money', 'warn', 'Pengingat pembayaran',
        (scopeTenantId ? 'Tagihan sewa ' : tenantName(inv.tenantId) + ': tagihan ') + fperiod(inv.periode) + ' jatuh tempo ' + (sisa === 0 ? 'hari ini' : sisa + ' hari lagi') + ' — ' + rp(outstandingOf(inv)) + '.',
        iso(NOW), { page: 'pembayaran' });
    }
  });

  DB.contracts.forEach(c => {
    if (scopeTenantId && c.tenantId !== scopeTenantId) return;
    const sisa = dUntil(c.akhir);
    if (sisa >= 0 && sisa <= 45)
      add('n-ktr-' + c.id, 'contract', 'warn', 'Kontrak akan berakhir',
        'Kontrak kamar ' + roomNo(c.roomId) + (scopeTenantId ? '' : ' (' + tenantName(c.tenantId) + ')') + ' berakhir dalam ' + sisa + ' hari.', iso(NOW), { page: 'kontrak' });
    if (c.status === 'Menunggu Tanda Tangan')
      add('n-ttd-' + c.id, 'edit', 'info', 'Kontrak menunggu tanda tangan',
        'Kontrak kamar ' + roomNo(c.roomId) + ' belum ditandatangani.', iso(NOW), { page: 'kontrak' });
  });

  DB.tickets.forEach(t => {
    if (scopeTenantId && t.tenantId !== scopeTenantId) return;
    if (isOpenTicket(t))
      add('n-tkt-' + t.id, 'wrench', t.prioritas === 'Darurat' ? 'bad' : 'info',
        'Laporan ' + t.status.toLowerCase(), t.id + ' — ' + t.judul + ' (kamar ' + roomNo(t.roomId) + ')', t.dilaporkan, { page: 'maintenance' });
    else if (t.diselesaikan && dUntil(t.diselesaikan) > -12)
      add('n-tkts-' + t.id, 'check', 'ok', 'Perbaikan selesai',
        t.id + ' — ' + t.judul + ' sudah selesai dikerjakan.', t.diselesaikan, { page: 'maintenance' });
  });

  DB.announcements.forEach(a => {
    if (scopeTenantId && !announcementFor(a, scopeTenantId)) return;
    add('n-pgm-' + a.id, 'megaphone', a.kategori === 'Penting' ? 'warn' : 'vio', 'Pengumuman', a.judul, a.tanggal, { page: 'pengumuman' });
  });

  if (!scopeTenantId) {
    DB.inventory.forEach(it => {
      const st = stockStatus(it);
      if (st !== 'Tersedia')
        add('n-inv-' + it.id, 'box', st === 'Habis' ? 'bad' : 'warn', 'Stok ' + st.toLowerCase(),
          it.nama + ': sisa ' + it.jumlah + ' ' + it.satuan + '. Minimum ' + it.minimum + ' ' + it.satuan + '.', iso(NOW), { page: 'inventaris' });
    });
    DB.maintSchedules.forEach(s => {
      const sisa = dUntil(s.berikutnya);
      if (sisa <= 10) {
        const a = byId(DB.assets, s.assetId);
        add('n-jdw-' + s.id, 'clock', sisa < 0 ? 'bad' : 'warn', 'Jadwal perawatan aset',
          (a ? a.nama : s.assetId) + ' — ' + s.jenis + ' ' + (sisa < 0 ? 'terlambat ' + Math.abs(sisa) + ' hari' : sisa + ' hari lagi') + '.', iso(NOW), { page: 'maintenance', tab: 'aset' });
      }
    });
    DB.cleaningTasks.forEach(c => {
      if (c.status !== 'Selesai' && dUntil(c.jatuhTempo) <= 1)
        add('n-cln-' + c.id, 'broom', dUntil(c.jatuhTempo) < 0 ? 'warn' : 'info', 'Tugas kebersihan',
          c.nama + ' — ' + c.lokasi + ', ' + relTime(c.jatuhTempo) + '.', iso(NOW), { page: 'cleaning' });
    });
    DB.feedback.filter(f => !f.teratasi && !f.ditindaklanjuti).forEach(f =>
      add('n-fb-' + f.id, 'star', 'bad', 'Keluhan belum tuntas',
        tenantName(f.tenantId) + ' menilai masalah belum selesai (' + f.skor + '★).', f.tanggal, { page: 'feedback' }));
  }

  DB.notifRead = DB.notifRead || [];
  return sortBy(out, n => n.tanggal, 'desc').map(n => ({ ...n, dibaca: DB.notifRead.includes(n.id) }));
}
function announcementFor(a, tenantId) {
  if (a.target === 'Semua') return true;
  const t = tenantOf(tenantId); if (!t) return false;
  const r = roomOf(t.roomId);
  if (a.target.startsWith('Lantai')) return r && ('Lantai ' + r.lantai) === a.target;
  if (a.target === 'Kamar') return a.targetId === t.roomId;
  if (a.target === 'Penghuni') return a.targetId === tenantId;
  return false;
}

/* ---------------- Grafik SVG ---------------- */
const CH = { w: 680, h: 210, pad: { l: 46, r: 12, t: 12, b: 26 } };
function chartBar(data, opts) {
  opts = opts || {};
  const { w, h, pad } = CH, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = Math.max(1, ...data.map(d => d.value), opts.min || 0);
  const bw = iw / data.length;
  const fmt = opts.fmt || rpShort;
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.label || 'Grafik batang') + '">';
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + ih - (ih * i / 3);
    s += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line-2)"/>';
    s += '<text x="' + (pad.l - 7) + '" y="' + (y + 4) + '" text-anchor="end" font-size="9.5" fill="var(--ink-3)">' + esc(fmt(max * i / 3)) + '</text>';
  }
  data.forEach((d, i) => {
    const bh = Math.max(2, ih * d.value / max);
    const x = pad.l + i * bw + bw * 0.24, y = pad.t + ih - bh;
    s += '<rect x="' + x + '" y="' + y + '" width="' + (bw * 0.52) + '" height="' + bh + '" rx="4" fill="' + (d.color || 'var(--brand)') + '"><title>' + esc(d.label + ': ' + fmt(d.value)) + '</title></rect>';
    s += '<text x="' + (pad.l + i * bw + bw / 2) + '" y="' + (h - 8) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">' + esc(d.label) + '</text>';
  });
  return '<div class="chart">' + s + '</svg></div>';
}
function chartLine(data, opts) {
  opts = opts || {};
  const { w, h, pad } = CH, iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = opts.max != null ? opts.max : Math.max(1, ...data.map(d => d.value));
  const min = opts.min != null ? opts.min : 0;
  const fmt = opts.fmt || (v => Math.round(v));
  const X = i => pad.l + (data.length === 1 ? iw / 2 : iw * i / (data.length - 1));
  const Y = v => pad.t + ih - ih * ((v - min) / (max - min || 1));
  let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.label || 'Grafik garis') + '">';
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + ih - (ih * i / 3);
    s += '<line x1="' + pad.l + '" x2="' + (w - pad.r) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line-2)"/>';
    s += '<text x="' + (pad.l - 7) + '" y="' + (y + 4) + '" text-anchor="end" font-size="9.5" fill="var(--ink-3)">' + esc(fmt(min + (max - min) * i / 3)) + '</text>';
  }
  const pts = data.map((d, i) => X(i) + ',' + Y(d.value));
  s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--brand)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<polygon points="' + pad.l + ',' + (pad.t + ih) + ' ' + pts.join(' ') + ' ' + (w - pad.r) + ',' + (pad.t + ih) + '" fill="var(--brand)" opacity=".08"/>';
  data.forEach((d, i) => {
    s += '<circle cx="' + X(i) + '" cy="' + Y(d.value) + '" r="3.6" fill="var(--surface)" stroke="var(--brand)" stroke-width="2"><title>' + esc(d.label + ': ' + fmt(d.value)) + '</title></circle>';
    s += '<text x="' + X(i) + '" y="' + (h - 8) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">' + esc(d.label) + '</text>';
  });
  return '<div class="chart">' + s + '</svg></div>';
}
function chartDonut(data, opts) {
  opts = opts || {};
  const total = sum(data, d => d.value) || 1;
  const R = 62, r = 40, cx = 80, cy = 80;
  let a0 = -Math.PI / 2, s = '<svg viewBox="0 0 320 160" role="img" aria-label="' + esc(opts.label || 'Grafik lingkaran') + '">';
  data.forEach(d => {
    const a1 = a0 + 2 * Math.PI * (d.value / total);
    if (d.value > 0) {
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      const p = (rad, ang) => (cx + rad * Math.cos(ang)) + ',' + (cy + rad * Math.sin(ang));
      s += '<path d="M ' + p(R, a0) + ' A ' + R + ' ' + R + ' 0 ' + large + ' 1 ' + p(R, a1) + ' L ' + p(r, a1) + ' A ' + r + ' ' + r + ' 0 ' + large + ' 0 ' + p(r, a0) + ' Z" fill="' + d.color + '"><title>' + esc(d.label + ': ' + d.value) + '</title></path>';
    }
    a0 = a1;
  });
  s += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="22" font-weight="800" fill="var(--ink)">' + esc(opts.center != null ? opts.center : total) + '</text>';
  s += '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" font-size="9.5" fill="var(--ink-3)">' + esc(opts.centerLabel || 'total') + '</text>';
  data.forEach((d, i) => {
    const y = 34 + i * 22;
    s += '<rect x="178" y="' + (y - 9) + '" width="10" height="10" rx="3" fill="' + d.color + '"/>';
    s += '<text x="195" y="' + y + '" font-size="11" fill="var(--ink-2)" font-weight="600">' + esc(d.label) + '</text>';
    s += '<text x="312" y="' + y + '" font-size="11" text-anchor="end" fill="var(--ink)" font-weight="700">' + esc(d.value) + '</text>';
  });
  return '<div class="chart">' + s + '</svg></div>';
}
function chartHBar(data, opts) {
  opts = opts || {};
  const max = Math.max(1, ...data.map(d => d.value));
  return '<div style="display:flex;flex-direction:column;gap:11px">' + data.map(d =>
    '<div><div class="spread" style="margin-bottom:4px"><span class="small strong">' + esc(d.label) + '</span><span class="small muted">' + esc(opts.fmt ? opts.fmt(d.value) : d.value) + '</span></div>' +
    '<div class="bar"><i style="width:' + (d.value / max * 100).toFixed(1) + '%;background:' + (d.color || 'var(--brand)') + '"></i></div></div>').join('') + '</div>';
}

/* ---------------- Tabel generik ---------------- */
/* cfg: {id, columns:[{key,label,sortable,value,render,cls}], rows, searchKeys, filters:[{key,label,options}], pageSize, onRow, empty, actions} */
function renderTable(cfg) {
  const st = tstate(cfg.id);
  let rows = cfg.rows.slice();
  const q = (st.q || '').toLowerCase().trim();
  if (q && cfg.searchKeys) rows = rows.filter(r => cfg.searchKeys(r).toLowerCase().includes(q));
  (cfg.filters || []).forEach(f => {
    const v = st.f[f.key];
    if (v) rows = rows.filter(r => f.test ? f.test(r, v) : String(r[f.key]) === v);
  });
  if (st.sort) {
    const col = cfg.columns.find(c => c.key === st.sort);
    if (col) rows = sortBy(rows, r => col.value ? col.value(r) : r[col.key], st.dir);
  } else if (cfg.defaultSort) {
    rows = sortBy(rows, cfg.defaultSort, cfg.defaultDir || 'asc');
  }
  const total = rows.length;
  const ps = cfg.pageSize || 10;
  const pages = Math.max(1, Math.ceil(total / ps));
  if (st.page > pages) st.page = pages;
  const view = rows.slice((st.page - 1) * ps, st.page * ps);

  let h = '<div class="toolbar">';
  if (cfg.searchKeys) h += '<div class="search">' + icon('search', 16) + '<input type="search" placeholder="' + esc(cfg.searchPlaceholder || 'Cari…') + '" value="' + esc(st.q) + '" data-tq="' + cfg.id + '" id="tq-' + cfg.id + '"></div>';
  (cfg.filters || []).forEach(f => {
    h += '<select class="sel-auto" data-tf="' + cfg.id + '" data-fk="' + f.key + '" aria-label="' + esc(f.label) + '"><option value="">' + esc(f.label) + ': semua</option>' +
      f.options.map(o => '<option value="' + esc(o) + '"' + (st.f[f.key] === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  });
  if (cfg.actions) h += '<div class="grow"></div>' + cfg.actions;
  h += '</div>';

  h += '<div class="table-wrap"><table><thead><tr>' + cfg.columns.map(c =>
    '<th class="' + (c.sortable === false ? '' : 'sortable ') + (c.cls || '') + '"' + (c.sortable === false ? '' : ' data-ts="' + cfg.id + '" data-tk="' + c.key + '"') + '>' +
    esc(c.label) + (st.sort === c.key ? (st.dir === 'asc' ? ' ↑' : ' ↓') : '') + '</th>').join('') + '</tr></thead><tbody>';
  if (!view.length) {
    h += '<tr><td colspan="' + cfg.columns.length + '"><div class="empty"><h3>' + esc((cfg.empty && cfg.empty.title) || 'Belum ada data') + '</h3><p class="muted small">' + esc((cfg.empty && cfg.empty.text) || 'Ubah kata kunci atau filter untuk melihat data lain.') + '</p></div></td></tr>';
  } else {
    view.forEach(r => {
      h += '<tr' + (cfg.onRow ? ' class="clickable" data-trow="' + cfg.id + '" data-rid="' + esc(r.id) + '" tabindex="0"' : '') + '>' +
        cfg.columns.map(c => '<td class="' + (c.cls || '') + '">' + (c.render ? c.render(r) : esc(c.value ? c.value(r) : r[c.key])) + '</td>').join('') + '</tr>';
    });
  }
  h += '</tbody></table>';
  if (total > ps) {
    h += '<div class="pager"><span>Menampilkan ' + ((st.page - 1) * ps + 1) + '–' + Math.min(total, st.page * ps) + ' dari ' + total + '</span>' +
      '<div class="row"><button class="btn sm" data-tp="' + cfg.id + '" data-pg="' + (st.page - 1) + '"' + (st.page === 1 ? ' disabled' : '') + '>Sebelumnya</button>' +
      '<span class="small">Hal. ' + st.page + ' / ' + pages + '</span>' +
      '<button class="btn sm" data-tp="' + cfg.id + '" data-pg="' + (st.page + 1) + '"' + (st.page === pages ? ' disabled' : '') + '>Berikutnya</button></div></div>';
  } else if (total) {
    h += '<div class="pager"><span>' + total + ' data</span><span></span></div>';
  }
  h += '</div>';
  TABLE_REG[cfg.id] = cfg;
  return h;
}

/* ---------------- Perhitungan ringkas ---------------- */
function metrics(period) {
  const p = period || UI.period;
  const rooms = DB.rooms;
  const terisi = rooms.filter(r => r.status === 'Terisi').length;
  const kosong = rooms.filter(r => r.status === 'Kosong').length;
  const invP = DB.invoices.filter(i => i.periode === p);
  const pendapatan = sum(DB.payments.filter(pay => {
    const inv = byId(DB.invoices, pay.invoiceId); return inv && inv.periode === p;
  }), x => x.nilai);
  const tagihanTertunggak = sum(DB.invoices.filter(i => i.status !== 'Lunas'), outstandingOf);
  const biaya = sum(DB.expenses.filter(e => e.periode === p), e => e.nilai);
  return {
    total: rooms.length, terisi, kosong,
    hunian: rooms.length ? Math.round(terisi / rooms.length * 100) : 0,
    pendapatan, potensi: sum(rooms.filter(r => r.status === 'Terisi'), r => r.sewa),
    tertunggak: tagihanTertunggak, biaya, laba: pendapatan - biaya,
    invoiceP: invP,
    tiketTerbuka: DB.tickets.filter(isOpenTikcetSafe).length,
    kontrakHabis: DB.contracts.filter(c => { const d = dUntil(c.akhir); return d >= 0 && d <= 30; }).length,
    terlambat: DB.invoices.filter(i => i.status === 'Terlambat').length,
    stokRendah: DB.inventory.filter(i => stockStatus(i) !== 'Tersedia').length,
    bersihTertunda: DB.cleaningTasks.filter(c => c.status !== 'Selesai').length,
    keluhan: DB.feedback.filter(f => !f.teratasi && !f.ditindaklanjuti).length,
  };
}
function isOpenTikcetSafe(t) { return isOpenTicket(t); }

function periodOptions(sel) {
  let h = '';
  for (let i = 0; i < 12; i++) {
    const p = periodOf(addMonths(NOW, -i));
    h += '<option value="' + p + '"' + (p === sel ? ' selected' : '') + '>' + fperiod(p) + '</option>';
  }
  return h;
}

/* ---------------- Dispatcher pemilik ---------------- */
function ownerPage(p) {
  switch (p) {
    case 'dashboard': return pageDashboard();
    case 'kamar': return pageKamar();
    case 'penghuni': return pagePenghuni();
    case 'pembayaran': return pagePembayaran();
    case 'kontrak': return pageKontrak();
    case 'maintenance': return pageMaintenance();
    case 'cleaning': return pageCleaning();
    case 'inventaris': return pageInventaris();
    case 'pengumuman': return pagePengumuman();
    case 'feedback': return pageFeedback();
    case 'laporan': return pageLaporan();
    case 'pengaturan': return pagePengaturan();
    default: return pageDashboard();
  }
}

/* ---------------- Dashboard ---------------- */
function pageDashboard() {
  const m = metrics();
  const att = [];
  if (m.terlambat) att.push([m.terlambat, 'pembayaran terlambat', 'money', 'pembayaran', { status: 'Terlambat' }]);
  if (m.tiketTerbuka) att.push([m.tiketTerbuka, 'laporan perbaikan terbuka', 'wrench', 'maintenance', {}]);
  if (m.kontrakHabis) att.push([m.kontrakHabis, 'kontrak berakhir ≤30 hari', 'contract', 'kontrak', {}]);
  if (m.stokRendah) att.push([m.stokRendah, 'barang stoknya menipis', 'box', 'inventaris', {}]);
  if (m.bersihTertunda) att.push([m.bersihTertunda, 'tugas kebersihan belum selesai', 'broom', 'cleaning', {}]);
  if (m.keluhan) att.push([m.keluhan, 'keluhan belum tuntas', 'star', 'feedback', {}]);
  if (m.kosong) att.push([m.kosong, 'kamar masih kosong', 'door', 'kamar', { status: 'Kosong' }]);

  const months = [];
  for (let i = 5; i >= 0; i--) {
    const p = periodOf(addMonths(NOW, -i));
    const rev = sum(DB.payments.filter(pay => { const inv = byId(DB.invoices, pay.invoiceId); return inv && inv.periode === p; }), x => x.nilai);
    const exp = sum(DB.expenses.filter(e => e.periode === p), e => e.nilai);
    months.push({ label: BULAN_S[Number(p.split('-')[1]) - 1], value: rev, exp, p });
  }
  const hunian = months.map(x => ({ label: x.label, value: Math.min(100, 74 + (x.p === UI.period ? m.hunian - 74 : Math.round(rnd6(x.p) * 18) + 72 - 72 + (m.hunian - 10))) }));
  // hunian historis sederhana namun stabil
  hunian.forEach((h, i) => { h.value = i === hunian.length - 1 ? m.hunian : Math.max(70, Math.min(100, m.hunian - (hunian.length - 1 - i) * 2 - (i % 2 ? 1 : 0))); });

  const statuses = ['Lunas', 'Menunggu', 'Sebagian', 'Terlambat'];
  const donut = statuses.map((s, i) => ({ label: s, value: m.invoiceP.filter(x => x.status === s).length, color: ['var(--brand)', 'var(--blue)', 'var(--violet)', 'var(--red)'][i] }));
  const tiketKat = Object.entries(groupBy(DB.tickets.filter(t => dUntil(t.dilaporkan) > -90), t => t.kategori))
    .map(([k, v]) => ({ label: k, value: v.length })).sort((a, b) => b.value - a.value).slice(0, 6);
  const biayaKat = Object.entries(groupBy(DB.expenses.filter(e => e.periode === UI.period), e => e.kategori))
    .map(([k, v]) => ({ label: k, value: sum(v, x => x.nilai) })).sort((a, b) => b.value - a.value);

  return '<div class="page-head spread"><div><h1>Dashboard</h1><div class="sub">Ringkasan ' + esc(DB.settings.namaProperti) + ' per ' + esc(fdate(iso(NOW))) + '</div></div>' +
    '<div class="row"><label class="small muted" for="dash-period">Periode</label><select id="dash-period" class="sel-auto" data-act="periode">' + periodOptions(UI.period) + '</select>' +
    '<button class="btn" data-act="unduh-ringkasan">' + icon('download', 16) + 'Unduh ringkasan</button></div></div>' +

    '<div class="attention"><div class="spread"><div><h2>Perlu perhatian hari ini</h2><div class="today">' + esc(HARI[NOW.getDay()] + ', ' + fdate(iso(NOW))) + '</div></div>' +
    '<span class="badge" style="background:rgba(255,255,255,.18);color:inherit">' + att.length + ' hal</span></div>' +
    (att.length ? '<div class="att-grid">' + att.map(a =>
      '<button class="att-item" data-act="att" data-page="' + a[3] + '" data-extra=\'' + JSON.stringify(a[4]) + '\'>' + icon(a[2], 19) +
      '<span class="stack"><span class="n">' + a[0] + '</span><span class="t">' + esc(a[1]) + '</span></span></button>').join('') + '</div>'
      : '<div class="att-empty">Semua beres. Tidak ada tunggakan, kontrak, atau perbaikan yang mendesak.</div>') +
    '</div>' +

    '<div class="stats mt">' +
    stat('door', 'Total kamar', m.total, m.terisi + ' terisi · ' + m.kosong + ' kosong') +
    stat('trend', 'Tingkat hunian', m.hunian + '%', 'Target 95%') +
    stat('money', 'Pendapatan ' + fperiod(UI.period), rp(m.pendapatan), 'Potensi ' + rp(m.potensi)) +
    stat('alert', 'Tunggakan', rp(m.tertunggak), DB.invoices.filter(i => i.status !== 'Lunas').length + ' tagihan belum lunas', m.tertunggak > 0 ? 'bad' : '') +
    stat('report', 'Pengeluaran', rp(m.biaya), 'Laba bersih ' + rp(m.laba)) +
    stat('wrench', 'Perbaikan terbuka', m.tiketTerbuka, DB.tickets.filter(t => t.prioritas === 'Darurat' && isOpenTicket(t)).length + ' darurat', m.tiketTerbuka ? 'warn' : '') +
    stat('contract', 'Kontrak akan habis', m.kontrakHabis, 'dalam 30 hari', m.kontrakHabis ? 'warn' : '') +
    stat('star', 'Kepuasan penghuni', avgScore().toFixed(1) + ' / 5', DB.feedback.length + ' penilaian') +
    '</div>' +

    '<div class="grid g2 mt">' +
    card('Pendapatan 6 bulan terakhir', chartBar(months.map(x => ({ label: x.label, value: x.value })), { label: 'Pendapatan bulanan' }) +
      '<div class="legend"><span><i style="background:var(--brand)"></i>Pembayaran diterima</span></div>') +
    card('Tingkat hunian', chartLine(hunian, { max: 100, min: 50, fmt: v => Math.round(v) + '%', label: 'Tingkat hunian' })) +
    card('Status tagihan ' + fperiod(UI.period), chartDonut(donut, { center: m.invoiceP.length, centerLabel: 'tagihan' })) +
    card('Laporan perbaikan per kategori', chartHBar(tiketKat, {}) + '<div class="legend"><span>90 hari terakhir</span></div>') +
    card('Pengeluaran ' + fperiod(UI.period), chartHBar(biayaKat, { fmt: rp, color: 'var(--amber)' })) +
    card('Aktivitas terbaru', aktivitasList()) +
    '</div>';
}
function rnd6(seed) { let h = 0; for (const c of seed) h = (h * 31 + c.charCodeAt(0)) % 997; return h / 997; }
function stat(ic, k, v, d, kind) {
  return '<div class="stat ' + (kind || '') + '"><div class="k">' + icon(ic, 15) + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="d">' + esc(d) + '</div></div>';
}
function card(title, body, actions) {
  return '<section class="card"><div class="card-head"><h3>' + esc(title) + '</h3>' + (actions || '') + '</div><div class="card-body">' + body + '</div></section>';
}
function avgScore() {
  const f = DB.feedback.filter(x => x.skor);
  return f.length ? sum(f, x => x.skor) / f.length : 0;
}
function aktivitasList() {
  const items = [];
  DB.payments.slice(-6).reverse().forEach(p => items.push({ t: p.tanggal, ic: 'money', k: 'ok', s: tenantName(p.tenantId) + ' membayar ' + rp(p.nilai) }));
  DB.tickets.slice(0, 4).forEach(t => items.push({ t: t.dilaporkan, ic: 'wrench', k: 'info', s: tenantName(t.tenantId) + ' melaporkan “' + t.judul + '”' }));
  DB.activity.slice(0, 6).forEach(a => items.push({ t: iso(NOW), ic: 'check', k: 'ok', s: a.text }));
  const list = sortBy(items, x => x.t, 'desc').slice(0, 7);
  return '<div class="timeline">' + list.map(i =>
    '<div class="tl-item"><span class="tl-ico" style="background:var(--' + (i.k === 'ok' ? 'brand-soft' : 'blue-soft') + ');color:var(--' + (i.k === 'ok' ? 'brand' : 'blue') + ')">' + icon(i.ic, 15) + '</span>' +
    '<span class="grow stack"><span class="small">' + esc(i.s) + '</span><span class="tiny dim">' + esc(relTime(i.t)) + '</span></span></div>').join('') + '</div>';
}

/* ---------------- Kamar ---------------- */
function pageKamar() {
  const st = tstate('kamar');
  if (UI.params.status && !st.f.status) { st.f.status = UI.params.status; UI.params = {}; }
  let rooms = DB.rooms.slice();
  const q = (st.q || '').toLowerCase();
  if (q) rooms = rooms.filter(r => (r.nomor + ' ' + r.tipe + ' ' + tenantName(r.tenantId)).toLowerCase().includes(q));

  const cards = rooms.map(r => {
    const t = tenantOf(r.tenantId);
    const inv = t ? invoicesOfTenant(t.id).find(i => i.periode === UI.period) : null;
    return '<button class="room s-' + (r.status === 'Terisi' ? 'occupied' : r.status === 'Kosong' ? 'available' : r.status === 'Dipesan' ? 'reserved' : 'maintenance') + '" data-act="kamar-detail" data-id="' + r.id + '">' +
      '<div class="spread"><span class="no">' + esc(r.nomor) + '</span>' + badge(r.status, KIND_KAMAR[r.status]) + '</div>' +
      '<div class="tiny dim" style="margin-top:2px">Lantai ' + r.lantai + ' · ' + esc(r.tipe) + '</div>' +
      '<div class="small strong" style="margin-top:9px">' + esc(rp(r.sewa)) + '<span class="tiny dim">/bulan</span></div>' +
      '<div class="row" style="margin-top:9px">' + (t ? '<span class="av sm">' + esc(initials(t.nama)) + '</span><span class="small">' + esc(t.nama) + '</span>' : '<span class="small dim">Belum ada penghuni</span>') + '</div>' +
      (inv ? '<div style="margin-top:9px">' + badge('Tagihan ' + inv.status, KIND_BAYAR[inv.status]) + '</div>' : '') +
      '</button>';
  }).join('');

  const tableHtml = renderTable({
    id: 'kamar-tbl', rows: rooms, pageSize: 12, searchKeys: r => r.nomor + ' ' + r.tipe + ' ' + tenantName(r.tenantId),
    onRow: r => openRoom(r.id),
    columns: [
      { key: 'nomor', label: 'Kamar', render: r => '<strong>' + esc(r.nomor) + '</strong>' },
      { key: 'lantai', label: 'Lantai', value: r => r.lantai },
      { key: 'tipe', label: 'Tipe' },
      { key: 'sewa', label: 'Sewa', cls: 'right nowrap', render: r => rp(r.sewa) },
      { key: 'penghuni', label: 'Penghuni', value: r => tenantName(r.tenantId), render: r => r.tenantId ? esc(tenantName(r.tenantId)) : '<span class="dim">—</span>' },
      { key: 'status', label: 'Status', render: r => badge(r.status, KIND_KAMAR[r.status]) },
      {
        key: 'kontrak', label: 'Kontrak berakhir', sortable: false, render: r => {
          const c = r.tenantId ? contractOfTenant(r.tenantId) : null;
          return c ? esc(fdateS(c.akhir)) + '<div class="tiny dim">' + esc(relTime(c.akhir)) + '</div>' : '<span class="dim">—</span>';
        }
      },
      {
        key: 'bayar', label: 'Pembayaran', sortable: false, render: r => {
          if (!r.tenantId) return '<span class="dim">—</span>';
          const inv = invoicesOfTenant(r.tenantId).find(i => i.periode === UI.period);
          return inv ? badge(inv.status, KIND_BAYAR[inv.status]) : '<span class="dim">—</span>';
        }
      },
    ],
  });

  return '<div class="page-head spread"><div><h1>Kamar</h1><div class="sub">' + DB.rooms.length + ' kamar · ' + DB.rooms.filter(r => r.status === 'Terisi').length + ' terisi · ' + DB.rooms.filter(r => r.status === 'Kosong').length + ' kosong</div></div>' +
    '<div class="row"><div class="segmented"><button class="' + (UI.roomView === 'kartu' ? 'active' : '') + '" data-act="room-view" data-v="kartu">Kartu</button><button class="' + (UI.roomView === 'tabel' ? 'active' : '') + '" data-act="room-view" data-v="tabel">Tabel</button></div>' +
    '<button class="btn primary" data-act="kamar-baru">' + icon('plus', 16) + 'Tambah kamar</button></div></div>' +

function selFilter(id, key, label, options, val) {
  return '<select class="sel-auto" data-tf="' + id + '" data-fk="' + key + '" aria-label="' + esc(label) + '"><option value="">' + esc(label) + ': semua</option>' +
    options.map(o => '<option value="' + esc(o) + '"' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
}

        { key: 'garansi', label: 'Garansi', render: a => dUntil(a.garansi) > 0 ? badge('Sampai ' + fdateS(a.garansi), 'ok') : badge('Habis', '') },

      ],
    });

  if (UI.ticketView === 'papan') {
    const cols = STATUS_TIKET.map(s => {
      const list = sortBy(DB.tickets.filter(t => t.status === s), t => t.dilaporkan, 'desc').slice(0, 8);
      return '<div class="kcol"><h4><span>' + esc(s) + '</span><span class="dim">' + DB.tickets.filter(t => t.status === s).length + '</span></h4>' +

    ],
    onRow: t => openTicket(t.id), defaultSort: t => t.dilaporkan, defaultDir: 'desc',
    columns: [
      { key: 'id', label: 'Tiket', render: t => '<span class="small strong">' + esc(t.id) + '</span>' },
      { key: 'judul', label: 'Masalah', render: t => '<strong>' + esc(t.judul) + '</strong><div class="tiny dim">' + esc(t.kategori) + '</div>' },
      { key: 'kamar', label: 'Kamar', value: t => roomNo(t.roomId), render: t => esc(roomNo(t.roomId)) + '<div class="tiny dim">' + esc(tenantName(t.tenantId)) + '</div>' },
      { key: 'prioritas', label: 'Prioritas', render: t => badge(t.prioritas, KIND_PRIO[t.prioritas]) },
      { key: 'teknisi', label: 'Petugas', render: t => t.teknisi ? esc(t.teknisi) : '<span class="dim">Belum ditugaskan</span>' },
      { key: 'dilaporkan', label: 'Dilaporkan', render: t => esc(fdateS(t.dilaporkan)) + '<div class="tiny dim">' + esc(relTime(t.dilaporkan)) + '</div>' },

      { key: 'status', label: 'Status', render: t => badge(t.status, KIND_TIKET[t.status]) },
    ],
  });
}

/* ---------------- Feedback ---------------- */
function pageFeedback() {

  const dist = [5, 4, 3, 2, 1].map(s => ({ label: s + ' bintang', value: fb.filter(f => f.skor === s).length, color: s >= 4 ? 'var(--brand)' : s === 3 ? 'var(--amber)' : 'var(--red)' }));
  const belum = fb.filter(f => !f.teratasi && !f.ditindaklanjuti);
  return '<div class="page-head"><h1>Feedback</h1><div class="sub">Penilaian penghuni setelah perbaikan selesai. Tidak ditampilkan ke penghuni lain.</div></div>' +
    '<div class="stats mb">' +
    stat('star', 'Rata-rata kepuasan', avg.toFixed(1) + ' / 5', fb.length + ' penilaian masuk') +
    stat('check', 'Masalah teratasi', fb.length ? Math.round(fb.filter(f => f.teratasi).length / fb.length * 100) + '%' : '—', fb.filter(f => f.teratasi).length + ' dari ' + fb.length) +
    stat('alert', 'Keluhan belum tuntas', belum.length, 'Perlu ditindaklanjuti', belum.length ? 'bad' : '') +
    stat('clock', 'Rata-rata penyelesaian', avgResolution().toFixed(1) + ' hari', 'Dari laporan sampai selesai') +

    '<div class="grid g2 mb">' +
    card('Sebaran penilaian', chartHBar(dist, {})) +

    '</div>' +
    renderTable({

      filters: [
        { key: 'teratasi', label: 'Hasil', options: ['Teratasi', 'Belum teratasi'], test: (f, v) => (v === 'Teratasi') === !!f.teratasi },

      onRow: f => openTicket(f.ticketId), defaultSort: f => f.tanggal, defaultDir: 'desc',
      columns: [

        { key: 'tenant', label: 'Penghuni', value: f => tenantName(f.tenantId), render: f => esc(tenantName(f.tenantId)) + '<div class="tiny dim">Kamar ' + esc(roomNo((tenantOf(f.tenantId) || {}).roomId)) + '</div>' },
        { key: 'skor', label: 'Penilaian', render: f => '<span class="stars">' + '★'.repeat(f.skor) + '<span style="color:var(--line)">' + '★'.repeat(5 - f.skor) + '</span></span>' },
        { key: 'teratasi', label: 'Teratasi?', render: f => f.teratasi ? badge('Ya', 'ok') : badge('Tidak', 'bad') },

        { key: 'tanggal', label: 'Tanggal', render: f => fdateS(f.tanggal) },

      ],
    });
}
function avgResolution() {
  const done = DB.tickets.filter(t => t.diselesaikan && t.dilaporkan);
  return done.length ? sum(done, t => daysBetween(t.dilaporkan, t.diselesaikan)) / done.length : 0;
}

function pageLaporan() {
  const jenis = UI.params.rep || 'keuangan';
  const head = '<div class="page-head spread"><div><h1>Laporan</h1><div class="sub">Rekap keuangan, hunian, perawatan, dan stok</div></div>' +
    '<div class="row"><select class="sel-auto" data-act="periode">' + periodOptions(UI.period) + '</select>' +
    '<button class="btn" data-act="ekspor" data-what="' + jenis + '" data-fmt="csv">CSV</button>' +
    '<button class="btn" data-act="ekspor" data-what="' + jenis + '" data-fmt="xlsx">Excel</button>' +
    '<button class="btn" data-act="ekspor" data-what="' + jenis + '" data-fmt="pdf">PDF</button></div></div>' +
    '<div class="tabs">' + [['keuangan', 'Keuangan'], ['hunian', 'Hunian'], ['perawatan', 'Perawatan'], ['stok', 'Inventaris']]
      .map(t => '<button class="' + (jenis === t[0] ? 'active' : '') + '" data-act="rep" data-t="' + t[0] + '">' + t[1] + '</button>').join('') + '</div>';

  if (jenis === 'keuangan') {
    const rows = [];
    for (let i = 5; i >= 0; i--) {
      const p = periodOf(addMonths(NOW, -i));
      const masuk = sum(DB.payments.filter(x => { const inv = byId(DB.invoices, x.invoiceId); return inv && inv.periode === p; }), x => x.nilai);
      const tagih = sum(DB.invoices.filter(x => x.periode === p), x => x.total);
      const keluar = sum(DB.expenses.filter(e => e.periode === p), e => e.nilai);
      rows.push({ id: p, periode: fperiod(p), tagih, masuk, tunggak: tagih - masuk, keluar, laba: masuk - keluar });
    }
    return head + '<div class="stats mb">' +
      stat('money', 'Pendapatan ' + fperiod(UI.period), rp(rows[rows.length - 1].masuk), 'Ditagihkan ' + rp(rows[rows.length - 1].tagih)) +
      stat('report', 'Pengeluaran', rp(rows[rows.length - 1].keluar), 'Operasional bulan ini') +
      stat('trend', 'Laba bersih', rp(rows[rows.length - 1].laba), 'Pendapatan dikurangi biaya') +
      stat('alert', 'Total tunggakan', rp(sum(DB.invoices.filter(i => i.status !== 'Lunas'), outstandingOf)), 'Seluruh periode', 'warn') +
      '</div>' +
      '<div class="grid g2 mb">' +
      card('Pendapatan vs pengeluaran', chartBar(rows.map(r => ({ label: r.periode.split(' ')[0].slice(0, 3), value: r.masuk })), {}) +
        chartHBar(rows.map(r => ({ label: r.periode, value: r.keluar, color: 'var(--amber)' })), { fmt: rp })) +
      card('Rincian pengeluaran ' + fperiod(UI.period), chartHBar(Object.entries(groupBy(DB.expenses.filter(e => e.periode === UI.period), e => e.kategori)).map(([k, v]) => ({ label: k, value: sum(v, x => x.nilai), color: 'var(--amber)' })), { fmt: rp })) +
      '</div>' +
      renderTable({
        id: 'rep-keu', rows, pageSize: 12,
        columns: [
          { key: 'periode', label: 'Periode' },
          { key: 'tagih', label: 'Ditagihkan', cls: 'right nowrap', render: r => rp(r.tagih) },
          { key: 'masuk', label: 'Diterima', cls: 'right nowrap', render: r => rp(r.masuk) },
          { key: 'tunggak', label: 'Tunggakan', cls: 'right nowrap', render: r => r.tunggak > 0 ? '<span style="color:var(--red)">' + rp(r.tunggak) + '</span>' : rp(0) },
          { key: 'keluar', label: 'Pengeluaran', cls: 'right nowrap', render: r => rp(r.keluar) },
          { key: 'laba', label: 'Arus kas bersih', cls: 'right nowrap', render: r => '<strong>' + rp(r.laba) + '</strong>' },
        ],
      });
  }
  if (jenis === 'hunian') {
    const perTipe = ['Standard', 'Deluxe', 'Premium'].map(t => {
      const rs = DB.rooms.filter(r => r.tipe === t);
      return { id: t, tipe: t, total: rs.length, terisi: rs.filter(r => r.status === 'Terisi').length, kosong: rs.filter(r => r.status === 'Kosong').length, potensi: sum(rs, r => r.sewa), aktual: sum(rs.filter(r => r.status === 'Terisi'), r => r.sewa) };
    });
    const habis = DB.contracts.filter(c => dUntil(c.akhir) >= 0 && dUntil(c.akhir) <= 90);
    return head + '<div class="grid g2 mb">' +
      card('Hunian per tipe kamar', chartHBar(perTipe.map(p => ({ label: p.tipe + ' (' + p.terisi + '/' + p.total + ')', value: Math.round(p.terisi / p.total * 100) })), { fmt: v => v + '%' })) +
      card('Perputaran penghuni', chartHBar([
        { label: 'Penghuni aktif', value: DB.tenants.filter(t => !t.arsip).length },
        { label: 'Masuk 6 bulan terakhir', value: DB.tenants.filter(t => dUntil(t.masuk) > -180).length },
        { label: 'Kontrak berakhir ≤90 hari', value: habis.length, color: 'var(--amber)' },
        { label: 'Kamar kosong', value: DB.rooms.filter(r => r.status === 'Kosong').length, color: 'var(--blue)' },
      ], {})) + '</div>' +
      renderTable({
        id: 'rep-hun', rows: perTipe, pageSize: 10,
        columns: [
          { key: 'tipe', label: 'Tipe kamar' },
          { key: 'total', label: 'Jumlah', cls: 'right' },
          { key: 'terisi', label: 'Terisi', cls: 'right' },
          { key: 'kosong', label: 'Kosong', cls: 'right' },
          { key: 'rate', label: 'Hunian', cls: 'right', sortable: false, render: r => Math.round(r.terisi / r.total * 100) + '%' },
          { key: 'potensi', label: 'Potensi sewa', cls: 'right nowrap', render: r => rp(r.potensi) },
          { key: 'aktual', label: 'Sewa berjalan', cls: 'right nowrap', render: r => rp(r.aktual) },
        ],
      }) +
      card('Kontrak berakhir dalam 90 hari', renderTable({
        id: 'rep-ktr', rows: habis, pageSize: 8, defaultSort: c => c.akhir,
        columns: [
          { key: 'tenant', label: 'Penghuni', value: c => tenantName(c.tenantId), render: c => esc(tenantName(c.tenantId)) },
          { key: 'kamar', label: 'Kamar', value: c => roomNo(c.roomId), render: c => esc(roomNo(c.roomId)) },
          { key: 'akhir', label: 'Berakhir', render: c => esc(fdate(c.akhir)) + ' <span class="tiny dim">(' + esc(relTime(c.akhir)) + ')</span>' },
          { key: 'sewa', label: 'Sewa', cls: 'right nowrap', render: c => rp(c.sewa) },
          { key: 'status', label: 'Status', render: c => badge(c.status, KIND_KONTRAK[c.status]) },
        ],
      }));
  }
  if (jenis === 'perawatan') {
    const kat = Object.entries(groupBy(DB.tickets, t => t.kategori)).map(([k, v]) => ({ id: k, kategori: k, jumlah: v.length, selesai: v.filter(t => t.status === 'Selesai' || t.status === 'Ditutup').length, biaya: sum(v, t => t.biaya || 0) })).sort((a, b) => b.jumlah - a.jumlah);
    return head + '<div class="stats mb">' +
      stat('wrench', 'Total laporan', DB.tickets.length, 'Sejak sistem digunakan') +
      stat('clock', 'Laporan terbuka', DB.tickets.filter(isOpenTicket).length, 'Sedang ditangani', DB.tickets.filter(isOpenTicket).length ? 'warn' : '') +
      stat('check', 'Rata-rata penyelesaian', avgResolution().toFixed(1) + ' hari', 'Dari lapor sampai selesai') +
      stat('money', 'Biaya perbaikan', rp(sum(DB.tickets, t => t.biaya || 0)), 'Total seluruh tiket') +
      '</div>' +
      '<div class="grid g2 mb">' +
      card('Masalah paling sering', chartHBar(kat.slice(0, 6).map(k => ({ label: k.kategori, value: k.jumlah })), {})) +
      card('Biaya perbaikan per kategori', chartHBar(kat.slice(0, 6).map(k => ({ label: k.kategori, value: k.biaya, color: 'var(--amber)' })), { fmt: rp })) +
      '</div>' +
      renderTable({
        id: 'rep-mnt', rows: kat, pageSize: 12,
        columns: [
          { key: 'kategori', label: 'Kategori' },
          { key: 'jumlah', label: 'Jumlah laporan', cls: 'right' },
          { key: 'selesai', label: 'Selesai', cls: 'right' },
          { key: 'terbuka', label: 'Masih terbuka', cls: 'right', sortable: false, render: k => k.jumlah - k.selesai },
          { key: 'biaya', label: 'Total biaya', cls: 'right nowrap', render: k => rp(k.biaya) },
        ],
      });
  }
  const rowsI = DB.inventory.map(i => ({ ...i, status: stockStatus(i), nilai: i.jumlah * i.harga }));
  return head + '<div class="grid g2 mb">' +
    card('Nilai stok per kategori', chartHBar(Object.entries(groupBy(rowsI, i => i.kategori)).map(([k, v]) => ({ label: k, value: sum(v, x => x.nilai) })), { fmt: rp })) +
    card('Pemakaian barang (transaksi keluar)', chartHBar(Object.entries(groupBy(DB.invTx.filter(t => t.jenis === 'Keluar'), t => (byId(DB.inventory, t.itemId) || {}).nama || '—')).map(([k, v]) => ({ label: k, value: sum(v, x => x.jumlah), color: 'var(--amber)' })), {})) +
    '</div>' +
    renderTable({
      id: 'rep-inv', rows: rowsI, pageSize: 12,
      columns: [
        { key: 'nama', label: 'Barang' },
        { key: 'kategori', label: 'Kategori' },
        { key: 'jumlah', label: 'Stok', cls: 'right', render: i => i.jumlah + ' ' + esc(i.satuan) },
        { key: 'minimum', label: 'Minimum', cls: 'right' },
        { key: 'nilai', label: 'Nilai stok', cls: 'right nowrap', render: i => rp(i.nilai) },
        { key: 'terakhirBeli', label: 'Pembelian terakhir', render: i => fdateS(i.terakhirBeli) },
        { key: 'status', label: 'Status', render: i => badge(i.status, KIND_STOK[i.status]) },
      ],
    });
}

function tenantPage(p) {

function modal(opts) {
  UI.modal = '<div class="modal-scrim" data-act="tutup-modal"><div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.title) + '" onclick="event.stopPropagation()">' +

    (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') + '</div></div>';
  render();
}
function closeModal() { UI.modal = null; render(); }
const btn = (label, act, kind, data) => '<button class="btn ' + (kind || '') + '" data-act="' + act + '"' + (data ? ' data-id="' + esc(data) + '"' : '') + '>' + label + '</button>';

/* ---------------- Kamar ---------------- */
function openRoom(id) {
  const r = roomOf(id); if (!r) return;
  const t = tenantOf(r.tenantId);
  const c = t ? contractOfTenant(t.id) : null;
  const inv = t ? invoicesOfTenant(t.id) : [];
  const tk = DB.tickets.filter(x => x.roomId === r.id);
  const aset = assetsOfRoom(r.id);
  const tab = UI.params.rtab || 'ringkas';
  const tabs = [['ringkas', 'Ringkasan'], ['bayar', 'Pembayaran'], ['kontrak', 'Kontrak'], ['maint', 'Perbaikan'], ['aset', 'Aset'], ['catatan', 'Catatan']];
  let body = '<div class="tabs">' + tabs.map(x => '<button class="' + (tab === x[0] ? 'active' : '') + '" data-act="rtab" data-t="' + x[0] + '" data-id="' + r.id + '">' + x[1] + '</button>').join('') + '</div>';

  if (tab === 'ringkas') {
    body += '<dl class="dl">' + dd('Nomor', esc(r.nomor)) + dd('Lantai', String(r.lantai)) + dd('Tipe', esc(r.tipe)) + dd('Luas', esc(r.luas)) +
      dd('Sewa', rp(r.sewa)) + dd('Status', badge(r.status, KIND_KAMAR[r.status])) + '</dl>' +
      '<div class="divider"></div><div class="small strong mb">Fasilitas</div><div class="row wrap">' + r.fasilitas.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>' +
      '<div class="divider"></div><div class="small strong mb">Utilitas</div><dl class="dl">' + dd('Listrik', esc(r.listrik)) + dd('Air', esc(r.air)) + dd('Internet', esc(r.wifi)) + '</dl>' +
      '<div class="divider"></div>' +
      (t ? '<div class="row"><div class="av">' + esc(initials(t.nama)) + '</div><div class="stack grow"><span class="strong">' + esc(t.nama) + '</span><span class="tiny dim">' + esc(t.telepon + ' · ' + t.pekerjaan) + '</span></div>' +
        '<button class="btn sm" data-act="penghuni-detail" data-id="' + t.id + '">Lihat penghuni</button></div>'
        : '<div class="spread"><span class="small muted">Kamar ini belum ada penghuni.</span><button class="btn sm primary" data-act="penghuni-baru" data-room="' + r.id + '">Tempatkan penghuni</button></div>') +
      '<div class="divider"></div><label class="field"><span>Ubah status kamar</span><select id="room-status">' +
      ['Terisi', 'Kosong', 'Dipesan', 'Perbaikan'].map(s => '<option' + (r.status === s ? ' selected' : '') + '>' + s + '</option>').join('') + '</select></label>';
  } else if (tab === 'bayar') {
    body += inv.length ? '<div class="stack" style="gap:8px">' + inv.slice(0, 10).map(i => '<div class="spread" style="padding:8px 2px;border-bottom:1px solid var(--line-2)">' +
      '<span class="stack"><span class="small strong">' + esc(fperiod(i.periode)) + '</span><span class="tiny dim">' + esc(i.id) + ' · jatuh tempo ' + esc(fdateS(i.jatuhTempo)) + '</span></span>' +
      '<span class="row">' + badge(i.status, KIND_BAYAR[i.status]) + '<span class="small strong">' + esc(rp(i.total)) + '</span>' +
      '<button class="btn sm" data-act="tagihan-detail" data-id="' + i.id + '">Rincian</button></span></div>').join('') + '</div>'
      : '<div class="empty"><h3>Belum ada tagihan</h3></div>';
  } else if (tab === 'kontrak') {
    body += c ? '<dl class="dl">' + dd('Nomor', esc(c.id)) + dd('Mulai', fdate(c.mulai)) + dd('Berakhir', fdate(c.akhir)) + dd('Durasi', c.durasi + ' bulan') +
      dd('Sewa', rp(c.sewa)) + dd('Deposit', rp(c.deposit)) + dd('Status', badge(c.status, KIND_KONTRAK[c.status])) + '</dl>' +
      '<div class="btn-group mt">' + btn('Lihat kontrak', 'kontrak-detail', '', c.id) + btn('Perpanjang', 'perpanjang', 'primary', c.id) + '</div>'
      : '<div class="empty"><h3>Belum ada kontrak</h3></div>';
  } else if (tab === 'maint') {
    body += tk.length ? '<div class="stack" style="gap:8px">' + tk.map(x => '<div class="spread" style="padding:8px 2px;border-bottom:1px solid var(--line-2)">' +
      '<span class="stack"><span class="small strong">' + esc(x.judul) + '</span><span class="tiny dim">' + esc(x.id + ' · ' + fdateS(x.dilaporkan) + ' · ' + x.kategori) + '</span></span>' +
      '<span class="row">' + badge(x.status, KIND_TIKET[x.status]) + '<button class="btn sm" data-act="tiket-detail" data-id="' + x.id + '">Buka</button></span></div>').join('') + '</div>'
      : '<div class="empty"><h3>Belum ada laporan perbaikan</h3></div>';
  } else if (tab === 'aset') {
    body += aset.length ? '<div class="stack" style="gap:8px">' + aset.map(a => '<div class="spread" style="padding:8px 2px;border-bottom:1px solid var(--line-2)">' +
      '<span class="stack"><span class="small strong">' + esc(a.nama) + '</span><span class="tiny dim">' + esc(a.id + ' · ' + a.merk + ' ' + a.model) + '</span></span>' +
      '<span class="row">' + badge(a.kondisi, a.kondisi === 'Baik' ? 'ok' : 'warn') + '<button class="btn sm" data-act="aset-detail" data-id="' + a.id + '">Buka</button></span></div>').join('') + '</div>'
      : '<div class="empty"><h3>Belum ada aset terdaftar</h3><p class="small muted">Tambahkan AC, furnitur, atau perangkat lain milik kamar ini.</p></div>';
  } else {
    body += '<label class="field"><span>Catatan kamar</span><textarea id="room-note" placeholder="Misalnya: cat ulang dinding setelah penghuni keluar.">' + esc(r.catatan) + '</textarea></label>';
  }

  modal({
    title: 'Kamar ' + r.nomor, sub: esc(r.tipe + ' · lantai ' + r.lantai + ' · ' + rp(r.sewa) + '/bulan'),
    body, wide: true,
    foot: btn('Tutup', 'tutup-modal') + btn('Simpan perubahan', 'simpan-kamar', 'primary', r.id),
  });
}
