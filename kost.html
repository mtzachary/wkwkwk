function val(id, d) { const e = document.getElementById(id); return e ? e.value : (d === undefined ? '' : d); }
function num(id, d) { const v = Number(val(id, d)); return isNaN(v) ? (d || 0) : v; }
function need(ids) { return ids.every(i => String(val(i)).trim() !== ''); }

/* ---------------- Ekspor ---------------- */
function toCSV(rows) {
  return rows.map(r => r.map(c => {
    const s = String(c == null ? '' : c);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(';')).join('\r\n');
}
async function saveFile(filename, data) {
  try {
    const dl = await claudeUse('downloads');
    if (dl) { await dl.save({ filename, data }); toast('Berkas ' + filename + ' siap diunduh.'); return; }
  } catch (e) {
    if (e && e.code === 'declined') return;
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Berkas ' + filename + ' diunduh.');
  } catch (e2) { toast('Unduhan tidak tersedia di tampilan ini.', 'warn'); }
}
async function claudeUse(name) {
  try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; }
}
function datasetFor(what) {
  switch (what) {
    case 'penghuni': return {
      nama: 'penghuni', judul: 'Daftar Penghuni',
      head: ['Nama', 'Kamar', 'Lantai', 'Telepon', 'Email', 'Pekerjaan', 'Masuk', 'Kontrak berakhir', 'Sewa', 'Deposit', 'Status'],
      rows: DB.tenants.filter(t => !t.arsip).map(t => { const c = contractOfTenant(t.id), r = roomOf(t.roomId); return [t.nama, r ? r.nomor : '', r ? r.lantai : '', t.telepon, t.email, t.pekerjaan, fdate(t.masuk), c ? fdate(c.akhir) : '', t.sewa, t.deposit, t.status]; }),
    };
    case 'tagihan': return {
      nama: 'tagihan', judul: 'Daftar Tagihan',
      head: ['No. tagihan', 'Penghuni', 'Kamar', 'Periode', 'Jatuh tempo', 'Sewa', 'Denda', 'Total', 'Dibayar', 'Sisa', 'Metode', 'Status'],
      rows: DB.invoices.map(i => [i.id, tenantName(i.tenantId), roomNo(i.roomId), fperiod(i.periode), fdate(i.jatuhTempo), i.sewa, i.denda || 0, i.total, i.dibayar, outstandingOf(i), i.metode || '', i.status]),
    };
    case 'kontrak': return {
      nama: 'kontrak', judul: 'Daftar Kontrak',
      head: ['No. kontrak', 'Penghuni', 'Kamar', 'Mulai', 'Berakhir', 'Durasi (bulan)', 'Sewa', 'Deposit', 'Status'],
      rows: DB.contracts.map(c => [c.id, tenantName(c.tenantId), roomNo(c.roomId), fdate(c.mulai), fdate(c.akhir), c.durasi, c.sewa, c.deposit, c.status]),
    };
    case 'inventaris': case 'stok': return {
      nama: 'inventaris', judul: 'Laporan Inventaris',
      head: ['Barang', 'Kategori', 'Stok', 'Satuan', 'Minimum', 'Harga satuan', 'Nilai stok', 'Lokasi', 'Supplier', 'Status'],
      rows: DB.inventory.map(i => [i.nama, i.kategori, i.jumlah, i.satuan, i.minimum, i.harga, i.jumlah * i.harga, i.lokasi, i.supplier, stockStatus(i)]),
    };
    case 'hunian': return {
      nama: 'hunian', judul: 'Laporan Hunian',
      head: ['Kamar', 'Lantai', 'Tipe', 'Sewa', 'Status', 'Penghuni', 'Kontrak berakhir'],
      rows: DB.rooms.map(r => { const c = r.tenantId ? contractOfTenant(r.tenantId) : null; return [r.nomor, r.lantai, r.tipe, r.sewa, r.status, tenantName(r.tenantId), c ? fdate(c.akhir) : '']; }),
    };
    case 'perawatan': return {
      nama: 'perawatan', judul: 'Laporan Perawatan',
      head: ['Tiket', 'Kamar', 'Penghuni', 'Kategori', 'Masalah', 'Prioritas', 'Dilaporkan', 'Selesai', 'Lama (hari)', 'Biaya', 'Petugas', 'Status'],
      rows: DB.tickets.map(t => [t.id, roomNo(t.roomId), tenantName(t.tenantId), t.kategori, t.judul, t.prioritas, fdate(t.dilaporkan), t.diselesaikan ? fdate(t.diselesaikan) : '', t.diselesaikan ? daysBetween(t.dilaporkan, t.diselesaikan) : '', t.biaya || 0, t.teknisi || '', t.status]),
    };
    default: {
      const rows = [];
      for (let i = 5; i >= 0; i--) {
        const p = periodOf(addMonths(NOW, -i));
        const masuk = sum(DB.payments.filter(x => { const inv = byId(DB.invoices, x.invoiceId); return inv && inv.periode === p; }), x => x.nilai);
        const tagih = sum(DB.invoices.filter(x => x.periode === p), x => x.total);
        const keluar = sum(DB.expenses.filter(e => e.periode === p), e => e.nilai);
        rows.push([fperiod(p), tagih, masuk, tagih - masuk, keluar, masuk - keluar]);
      }
      return { nama: 'keuangan', judul: 'Laporan Keuangan', head: ['Periode', 'Ditagihkan', 'Diterima', 'Tunggakan', 'Pengeluaran', 'Arus kas bersih'], rows };
    }
  }
}
async function ekspor(what, fmt) {
  const d = datasetFor(what);
  const stamp = iso(NOW);
  if (fmt === 'xlsx' && window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet([d.head, ...d.rows]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, d.judul.slice(0, 28));
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return saveFile(d.nama + '-' + stamp + '.xlsx', buf);
  }
  if (fmt === 'pdf' && window.jspdf && window.jspdf.jsPDF) {
    const doc = new window.jspdf.jsPDF({ orientation: 'landscape' });
    doc.setFontSize(14); doc.text(d.judul + ' — ' + DB.settings.namaProperti, 14, 15);
    doc.setFontSize(9); doc.text('Dicetak ' + fdate(stamp), 14, 21);
    if (doc.autoTable) doc.autoTable({ head: [d.head], body: d.rows.map(r => r.map(String)), startY: 26, styles: { fontSize: 8 }, headStyles: { fillColor: [15, 107, 82] } });
    return saveFile(d.nama + '-' + stamp + '.pdf', doc.output('arraybuffer'));
  }
  if (fmt === 'xlsx' || fmt === 'pdf') toast('Format itu belum siap, diunduh sebagai CSV.', 'warn');
  return saveFile(d.nama + '-' + stamp + '.csv', '\ufeff' + toCSV([d.head, ...d.rows]));
}

/* ---------------- Aksi bisnis ---------------- */
function buatTagihanBulanIni() {
  const p = UI.period;
  let n = 0;
  DB.tenants.filter(t => !t.arsip && t.status !== 'Sudah Keluar').forEach(t => {
    if (DB.invoices.some(i => i.tenantId === t.id && i.periode === p)) return;
    const jatuh = new Date(Number(p.split('-')[0]), Number(p.split('-')[1]) - 1, DB.settings.jatuhTempo);
    DB.invoices.push({
      id: 'INV-' + p.replace('-', '') + '-' + String(DB.invoices.length + 1).padStart(3, '0'),
      propertyId: 'P1', tenantId: t.id, roomId: t.roomId, periode: p, jatuhTempo: iso(jatuh),
      sewa: t.sewa, tambahan: [], diskon: 0, total: t.sewa, status: 'Menunggu', dibayar: 0, tanggalBayar: null, metode: null, denda: 0,
    });
    n++;
  });
  refreshStatuses();
  toast(n ? n + ' tagihan ' + fperiod(p) + ' dibuat dan pengingat dijadwalkan.' : 'Semua tagihan ' + fperiod(p) + ' sudah dibuat.');
  logAct(n + ' tagihan ' + fperiod(p) + ' dibuat');
}
function catatPembayaran(invId, nilai, metode, tanggal, catatan) {
  const inv = byId(DB.invoices, invId); if (!inv) return;
  DB.payments.push({ id: 'BYR-' + String(DB.payments.length + 1).padStart(4, '0'), invoiceId: inv.id, tenantId: inv.tenantId, tanggal, nilai, metode, catatan: catatan || '' });
  inv.dibayar = (inv.dibayar || 0) + nilai;
  inv.metode = metode; inv.tanggalBayar = tanggal;
  inv.status = outstandingOf(inv) <= 0 ? 'Lunas' : 'Sebagian';
  logAct('Pembayaran ' + rp(nilai) + ' dari ' + tenantName(inv.tenantId) + ' dicatat');
}
function refreshStatuses() {
  DB.invoices.forEach(i => {
    if (i.status === 'Lunas') return;
    const lewat = daysBetween(D(i.jatuhTempo), NOW);
    if (lewat > 0) {
      i.status = i.dibayar > 0 ? 'Sebagian' : 'Terlambat';
      i.denda = Math.min(DB.settings.tempoDenda, lewat) * DB.settings.dendaHarian;
    } else if (i.dibayar > 0) i.status = 'Sebagian';
  });
  DB.contracts.forEach(c => {
    if (c.status === 'Draft' || c.status === 'Menunggu Tanda Tangan') return;
    const s = dUntil(c.akhir);
    c.status = s < 0 ? 'Berakhir' : s <= 30 ? 'Akan Berakhir' : 'Aktif';
    const t = tenantOf(c.tenantId);
    if (t && t.status !== 'Sudah Keluar' && t.status !== 'Pemberitahuan Keluar') t.status = s <= 30 && s >= 0 ? 'Kontrak Akan Habis' : 'Aktif';
  });
  DB.rooms.forEach(r => { if (r.tenantId && !tenantOf(r.tenantId)) { r.tenantId = null; r.status = 'Kosong'; } });
  saveState();
}

/* ---------------- Penanganan klik ---------------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act], [data-nav], [data-trow], [data-ts], [data-tp]');
  if (!el) { if (UI.notifOpen) { UI.notifOpen = false; render(); } return; }
  const act = el.dataset.act;
  const id = el.dataset.id;

  if (el.dataset.nav) { ev.preventDefault(); go(el.dataset.nav); return; }
  if (el.dataset.ts) { const s = tstate(el.dataset.ts); if (s.sort === el.dataset.tk) s.dir = s.dir === 'asc' ? 'desc' : 'asc'; else { s.sort = el.dataset.tk; s.dir = 'asc'; } render(); return; }
  if (el.dataset.tp) { tstate(el.dataset.tp, { page: Number(el.dataset.pg) }); render(); return; }
  if (el.dataset.trow) { const cfg = TABLE_REG[el.dataset.trow]; const row = cfg && cfg.rows.find(r => String(r.id) === el.dataset.rid); if (cfg && cfg.onRow && row) cfg.onRow(row); return; }
  if (!act) return;
  ev.preventDefault();

  switch (act) {
    /* --- autentikasi & kerangka --- */
    case 'role': UI.params = { role: el.dataset.role }; render(); break;
    case 'login': doLogin(); break;
    case 'keluar': UI.session = null; UI.page = 'dashboard'; UI.params = {}; UI.tables = {}; render(); break;
    case 'nav': go(el.dataset.page); break;
    case 'buka-nav': document.body.classList.add('nav-open'); break;
    case 'tutup-nav': document.body.classList.remove('nav-open'); break;
    case 'notif': UI.notifOpen = !UI.notifOpen; render(); break;
    case 'baca-semua': {
      const list = buildNotifications(UI.session.role === 'owner' ? null : UI.session.tenantId);
      DB.notifRead = Array.from(new Set((DB.notifRead || []).concat(list.map(n => n.id))));
      saveState(); render(); break;
    }
    case 'notif-go': DB.notifRead = Array.from(new Set((DB.notifRead || []).concat([id]))); saveState(); go(el.dataset.page === 'pembayaran' && UI.session.role === 'tenant' ? 't-pembayaran' : el.dataset.page); break;
    case 'tema': DB.settings.theme = DB.settings.theme === 'dark' ? 'light' : 'dark'; saveState(); render(); break;
    case 'tema-set': DB.settings.theme = el.dataset.v; saveState(); render(); break;
    case 'periode': break;
    case 'att': { const extra = JSON.parse(el.dataset.extra || '{}'); UI.tables = {}; go(el.dataset.page, extra); break; }
    case 'room-view': UI.roomView = el.dataset.v; render(); break;
    case 'tkt-view': UI.ticketView = el.dataset.v; render(); break;
    case 'mtab': UI.params = { tab: el.dataset.t }; render(); break;
    case 'rep': UI.params = { rep: el.dataset.t }; render(); break;
    case 'properti': propertiModal(); break;
    case 'properti-aktif': toast('Properti kedua dapat diaktifkan setelah data kamar dilengkapi.', 'warn'); break;
    case 'tutup-modal': closeModal(); break;
    case 'foto-dummy': toast('Unggahan foto tersedia saat sistem tersambung ke penyimpanan berkas.', 'warn'); break;

    /* --- kamar --- */
    case 'kamar-detail': UI.params.rtab = 'ringkas'; openRoom(id); break;
    case 'rtab': UI.params.rtab = el.dataset.t; openRoom(id); break;
    case 'kamar-baru': formRoom(); break;
    case 'kamar-simpan-baru': {
      if (!need(['fr-nomor'])) { toast('Nomor kamar wajib diisi.', 'bad'); break; }
      const tipe = val('fr-tipe');
      DB.rooms.push({
        id: 'R-' + val('fr-nomor'), propertyId: 'P1', nomor: val('fr-nomor'), lantai: num('fr-lantai', 1), tipe,
        sewa: num('fr-sewa'), luas: TIPE[tipe].luas, fasilitas: TIPE[tipe].fasilitas.slice(), status: 'Kosong', tenantId: null,
        catatan: '', listrik: 'Termasuk', air: 'Termasuk', wifi: 'Termasuk',
      });
      saveState(); closeModal(); toast('Kamar ' + val('fr-nomor') + ' ditambahkan.'); break;
    }
    case 'simpan-kamar': {
      const r = roomOf(id);
      const s = document.getElementById('room-status'); if (s && r) { r.status = s.value; if (r.status !== 'Terisi') r.tenantId = r.status === 'Terisi' ? r.tenantId : r.tenantId; }
      const n = document.getElementById('room-note'); if (n && r) r.catatan = n.value;
      saveState(); closeModal(); toast('Perubahan kamar disimpan.'); break;
    }

    /* --- penghuni --- */
    case 'penghuni-baru': formTenant(null, el.dataset.room); break;
    case 'penghuni-edit': formTenant(id); break;
    case 'penghuni-detail': openTenant(id); break;
    case 'penghuni-simpan': simpanPenghuni(id); break;
    case 'penghuni-arsip': {
      const t = tenantOf(id); if (!t) break;
      t.arsip = true; t.status = 'Sudah Keluar'; t.keluar = iso(NOW);
      const r = roomOf(t.roomId); if (r) { r.tenantId = null; r.status = 'Kosong'; }
      saveState(); closeModal(); toast(t.nama + ' diarsipkan dan kamar ditandai kosong.'); break;
    }

    /* --- pembayaran --- */
    case 'tagihan-detail': openInvoice(id); break;
    case 'buat-tagihan': buatTagihanBulanIni(); saveState(); render(); break;
    case 'tandai-lunas': formPayment(id); break;
    case 'bayar-simpan': {
      const n = num('fp-nilai'); if (n <= 0) { toast('Jumlah pembayaran belum diisi.', 'bad'); break; }
      catatPembayaran(id, n, val('fp-metode'), val('fp-tanggal', iso(NOW)), val('fp-catatan'));
      saveState(); closeModal(); toast('Pembayaran dicatat. Status tagihan diperbarui.'); break;
    }
    case 'kuitansi': receipt(id); break;
    case 'unduh-kuitansi': { const i = byId(DB.invoices, id); saveFile('kuitansi-' + i.id + '.csv', '\ufeff' + toCSV([['Nomor', 'Penghuni', 'Kamar', 'Periode', 'Tanggal', 'Metode', 'Jumlah'], [i.id, tenantName(i.tenantId), roomNo(i.roomId), fperiod(i.periode), fdate(i.tanggalBayar), i.metode, i.dibayar]])); break; }
    case 'kirim-pengingat': { const i = byId(DB.invoices, id); toast('Pengingat dikirim ke ' + tenantName(i.tenantId) + ' lewat WhatsApp dan notifikasi aplikasi.'); logAct('Pengingat tagihan ' + i.id + ' dikirim'); saveState(); break; }
    case 'bayar-sekarang': UI.params.pm = 'QRIS'; formPayNow(id); break;
    case 'pm': UI.params.pm = el.dataset.v; formPayNow(id); break;
    case 'bayar-simulasi': {
      const i = byId(DB.invoices, id);
      catatPembayaran(id, outstandingOf(i), UI.params.pm || 'QRIS', iso(NOW), 'Pembayaran lewat portal penghuni');
      saveState(); closeModal(); toast('Pembayaran diterima. Kuitansi sudah tersedia.'); break;
    }

    /* --- kontrak --- */
    case 'kontrak-baru': formContract(null); break;
    case 'kontrak-detail': if (id) openContract(id); break;
    case 'perpanjang': formContract(id); break;
    case 'kontrak-simpan': simpanKontrak(id); break;
    case 'kontrak-kirim': toast('Kontrak dikirim ke penghuni untuk ditandatangani.'); break;
    case 'unduh-kontrak': { const c = byId(DB.contracts, id); ekspor('kontrak', 'pdf'); break; }
    case 'ttd-kontrak': { const c = byId(DB.contracts, id); c.ttdPenghuni = true; c.ttdTanggal = iso(NOW); c.status = 'Aktif'; refreshStatuses(); closeModal(); toast('Kontrak berhasil ditandatangani.'); render(); break; }
    case 'ajukan-perpanjangan': toast('Pengajuan perpanjangan dikirim ke pemilik kos.'); logAct(tenantName(UI.session.tenantId) + ' mengajukan perpanjangan kontrak'); saveState(); break;

    /* --- maintenance --- */
    case 'tiket-baru': case 'lapor-masalah': formTicket(); break;
    case 'tiket-detail': openTicket(id); break;
    case 'tiket-kirim': kirimTiket(); break;
    case 'tiket-simpan': simpanTiket(id); break;
    case 'aset-baru': formAsset(); break;
    case 'aset-detail': openAsset(id); break;
    case 'aset-simpan': { const a = byId(DB.assets, id); const n = document.getElementById('fa-catatan'); if (a && n) a.catatan = n.value; saveState(); closeModal(); toast('Catatan aset disimpan.'); break; }
    case 'aset-baru-simpan': {
      if (!need(['fas-nama'])) { toast('Nama aset wajib diisi.', 'bad'); break; }
      const aid = 'AST-' + String(DB.assets.length + 1).padStart(3, '0');
      DB.assets.push({ id: aid, propertyId: 'P1', nama: val('fas-nama'), kategori: val('fas-kategori'), merk: val('fas-merk'), model: val('fas-model'), roomId: val('fas-room') || null, lokasi: val('fas-room') ? 'Kamar ' + roomNo(val('fas-room')) : 'Area umum', dibeli: val('fas-beli'), dipasang: val('fas-beli'), garansi: val('fas-garansi'), kondisi: 'Baik', terakhirRawat: val('fas-beli'), catatan: '' });
      DB.maintSchedules.push({ id: 'JDW-' + String(DB.maintSchedules.length + 1).padStart(3, '0'), assetId: aid, jenis: 'Pemeriksaan rutin', tiapBulan: num('fas-tiap', 3), terakhir: val('fas-beli'), berikutnya: iso(addMonths(D(val('fas-beli')), num('fas-tiap', 3))), penanggung: TEKNISI[0] });
      saveState(); closeModal(); toast('Aset ditambahkan beserta jadwal perawatannya.'); break;
    }
    case 'rawat-selesai': {
      const s = byId(DB.maintSchedules, id); if (!s) break;
      s.terakhir = iso(NOW); s.berikutnya = iso(addMonths(NOW, s.tiapBulan));
      const a = byId(DB.assets, s.assetId); if (a) { a.terakhirRawat = iso(NOW); a.kondisi = 'Baik'; }
      saveState(); closeModal(); toast('Perawatan dicatat. Jadwal berikutnya ' + fdate(s.berikutnya) + '.'); render(); break;
    }

    /* --- cleaning --- */
    case 'cleaning-baru': formCleaning(); break;
    case 'cleaning-simpan': {
      if (!need(['fc-nama'])) { toast('Nama tugas wajib diisi.', 'bad'); break; }
      DB.cleaningTasks.push({ id: 'CLN-' + String(DB.cleaningTasks.length + 1).padStart(3, '0'), propertyId: 'P1', nama: val('fc-nama'), lokasi: val('fc-lokasi'), frekuensi: val('fc-frekuensi'), petugas: val('fc-petugas'), jatuhTempo: val('fc-due'), status: 'Menunggu', selesaiTanggal: null, foto: [], catatan: val('fc-catatan') });
      saveState(); closeModal(); toast('Tugas kebersihan ditambahkan.'); break;
    }
    case 'cleaning-selesai': {
      const c = byId(DB.cleaningTasks, id); if (!c) break;
      c.status = 'Selesai'; c.selesaiTanggal = iso(NOW); c.foto = ['Foto bukti'];
      const tambah = c.frekuensi === 'Harian' ? 1 : c.frekuensi === '3x seminggu' ? 2 : c.frekuensi === 'Mingguan' ? 7 : 30;
      c.jatuhTempo = iso(addDays(NOW, tambah));
      saveState(); toast(c.nama + ' ditandai selesai. Jadwal berikutnya ' + fdate(c.jatuhTempo) + '.'); render(); break;
    }

    /* --- inventaris --- */
    case 'barang-baru': formItem(); break;
    case 'barang-simpan': {
      if (!need(['fb-nama'])) { toast('Nama barang wajib diisi.', 'bad'); break; }
      DB.inventory.push({ id: 'INV-B' + String(DB.inventory.length + 1).padStart(3, '0'), propertyId: 'P1', nama: val('fb-nama'), kategori: val('fb-kategori'), jumlah: num('fb-jumlah'), minimum: num('fb-min', 1), satuan: val('fb-satuan', 'pcs'), lokasi: val('fb-lokasi'), harga: num('fb-harga'), supplier: val('fb-supplier'), terakhirBeli: iso(NOW), catatan: '' });
      saveState(); closeModal(); toast('Barang ditambahkan ke inventaris.'); break;
    }
    case 'stok-masuk': formStock(id, 'Masuk'); break;
    case 'stok-keluar': formStock(id, 'Keluar'); break;
    case 'stok-simpan-masuk': case 'stok-simpan-keluar': {
      const it = byId(DB.inventory, id); if (!it) break;
      const j = num('fs-jumlah', 0); if (j <= 0) { toast('Jumlah harus lebih dari nol.', 'bad'); break; }
      const masuk = act === 'stok-simpan-masuk';
      if (!masuk && j > it.jumlah) { toast('Stok tidak mencukupi.', 'bad'); break; }
      it.jumlah += masuk ? j : -j;
      if (masuk) { it.harga = num('fs-harga', it.harga); it.supplier = val('fs-supplier', it.supplier); it.terakhirBeli = val('fs-tanggal', iso(NOW)); }
      DB.invTx.unshift({ id: uid('TX'), itemId: it.id, jenis: masuk ? 'Masuk' : 'Keluar', jumlah: j, tanggal: val('fs-tanggal', iso(NOW)), ref: masuk ? 'Pembelian' : val('fs-ref', 'Pemakaian'), catatan: val('fs-catatan') });
      saveState(); closeModal();
      toast(masuk ? 'Stok ' + it.nama + ' kini ' + it.jumlah + ' ' + it.satuan + '.' : it.nama + ' berkurang ' + j + ' ' + it.satuan + '.' + (stockStatus(it) !== 'Tersedia' ? ' Stok sudah di bawah minimum.' : ''));
      break;
    }

    /* --- pengumuman --- */
    case 'pengumuman-baru': UI.params.target = 'Semua'; formAnnouncement(); break;
    case 'pgm-target': break;
    case 'pengumuman-simpan': {
      if (!need(['fp-judul', 'fp-isi'])) { toast('Judul dan isi pengumuman wajib diisi.', 'bad'); break; }
      DB.announcements.unshift({ id: 'PGM-' + String(DB.announcements.length + 1).padStart(3, '0'), propertyId: 'P1', judul: val('fp-judul'), isi: val('fp-isi'), target: val('fp-target'), targetId: val('fp-targetid') || null, kategori: val('fp-kategori'), tanggal: iso(NOW), dibacaOleh: [] });
      saveState(); closeModal(); toast('Pengumuman dikirim ke penghuni.'); break;
    }
    case 'pengumuman-kirim': toast('Pengumuman dikirim ulang lewat notifikasi aplikasi dan WhatsApp.'); break;
    case 'pengumuman-hapus': { DB.announcements = DB.announcements.filter(a => a.id !== id); saveState(); toast('Pengumuman dihapus.'); render(); break; }
    case 'baca-pengumuman': { const tid = UI.session.tenantId; DB.announcements.forEach(a => { if (announcementFor(a, tid) && !(a.dibacaOleh || []).includes(tid)) a.dibacaOleh.push(tid); }); saveState(); render(); break; }

    /* --- feedback --- */
    case 'beri-feedback': UI.params.skor = 0; UI.params.teratasi = null; formFeedback(id); break;
    case 'fb-skor': UI.params.skor = Number(el.dataset.v); formFeedback(id); break;
    case 'fb-teratasi': UI.params.teratasi = el.dataset.v; formFeedback(id); break;
    case 'fb-kirim': {
      if (!UI.params.skor) { toast('Pilih dulu penilaian bintangnya.', 'bad'); break; }
      const tk = byId(DB.tickets, id);
      DB.feedback.unshift({ id: uid('FB'), ticketId: id, tenantId: tk.tenantId, teratasi: UI.params.teratasi !== 'tidak', skor: UI.params.skor, komentar: val('ffb-komentar'), tanggal: iso(NOW), ditindaklanjuti: UI.params.teratasi !== 'tidak' });
      if (UI.params.teratasi === 'tidak') { tk.status = 'Dikerjakan'; toast('Terima kasih. Laporan dibuka kembali agar ditangani ulang.'); }
      else { tk.status = 'Ditutup'; toast('Terima kasih atas penilaiannya.'); }
      saveState(); closeModal(); break;
    }
    case 'fb-tindak': { const f = byId(DB.feedback, id); if (f) { f.ditindaklanjuti = true; const tk = byId(DB.tickets, f.ticketId); if (tk) tk.status = 'Dikerjakan'; } saveState(); toast('Keluhan ditindaklanjuti dan laporan dibuka kembali.'); render(); break; }

    /* --- profil & pengaturan --- */
    case 'simpan-profil': {
      const t = me();
      $$('[data-me]').forEach(i => { t[i.dataset.me] = i.value; });
      saveState(); toast('Profil diperbarui.'); render(); break;
    }
    case 'ganti-sandi': toast('Kata sandi diperbarui.'); break;
    case 'simpan-pengaturan': {
      $$('[data-set]').forEach(i => { const k = i.dataset.set; DB.settings[k] = i.type === 'number' ? Number(i.value) : i.value; });
      $$('[data-rem]').forEach(i => { DB.settings.reminder[i.dataset.rem] = i.checked; });
      $$('[data-kanal]').forEach(i => { DB.settings.kanal[i.dataset.kanal] = i.checked; });
      $$('[data-gw]').forEach(i => { DB.settings.gateway[i.dataset.gw] = i.checked; });
      $$('[data-gwset]').forEach(i => { DB.settings.gateway[i.dataset.gwset] = i.value; });
      DB.properties[0].nama = DB.settings.namaProperti;
      saveState(); toast('Pengaturan disimpan.'); render(); break;
    }
    case 'reset-demo': clearState(); DB = seedDB(); refreshStatuses(); UI.tables = {}; toast('Data contoh dikembalikan.'); render(); break;
    case 'ekspor': ekspor(el.dataset.what, el.dataset.fmt || 'csv'); break;
    case 'unduh-ringkasan': ekspor('keuangan', 'csv'); break;
    default: break;
  }
});

/* ---------------- input & select ---------------- */
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.tq) { tstate(el.dataset.tq, { q: el.value, page: 1 }); UI.focus = el.id; render(); UI.focus = null; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.tf) { const s = tstate(el.dataset.tf); s.f[el.dataset.fk] = el.value; s.page = 1; render(); return; }
  if (el.dataset && el.dataset.act === 'periode') { UI.period = el.value; render(); return; }
  if (el.dataset && el.dataset.act === 'pgm-target') { UI.params.target = el.value; formAnnouncement(); return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && UI.modal) closeModal();
  if (ev.key === 'Enter' && !UI.session) doLogin();
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.trow) ev.target.click();
});

/* ---------------- Aksi panjang ---------------- */
function doLogin() {
  const email = (val('login-email') || '').trim().toLowerCase();
  const pass = val('login-pass');
  const role = UI.params.role || 'owner';
  const u = DB.users.find(x => x.email.toLowerCase() === email && x.role === role);
  if (!u || u.pass !== pass) { UI.params = { role, err: 'Email atau kata sandi tidak cocok. Gunakan akun demo di bawah.' }; render(); return; }
  UI.session = { role: u.role, userId: u.id, tenantId: u.tenantId || null };
  UI.page = u.role === 'owner' ? 'dashboard' : 't-dashboard';
  UI.params = {}; UI.tables = {};
  refreshStatuses();
  render();
  toast('Selamat datang, ' + u.nama.split(' ')[0] + '.');
}

function simpanPenghuni(id) {
  const nama = val('ft-nama').trim();
  if (!nama) { toast('Nama penghuni wajib diisi.', 'bad'); return; }
  const roomId = val('ft-room');
  if (!roomId) { toast('Tidak ada kamar kosong. Tambah kamar terlebih dahulu.', 'bad'); return; }
  const room = roomOf(roomId);
  const sewa = num('ft-sewa') || (room ? room.sewa : 0);
  if (id) {
    const t = tenantOf(id);
    const lama = t.roomId;
    Object.assign(t, { nama, telepon: val('ft-telepon'), email: val('ft-email'), ktp: val('ft-ktp'), pekerjaan: val('ft-pekerjaan'), darurat: val('ft-darurat'), roomId, masuk: val('ft-masuk'), sewa, deposit: num('ft-deposit') || sewa, status: val('ft-status') });
    if (lama !== roomId) {
      const old = roomOf(lama); if (old) { old.tenantId = null; old.status = 'Kosong'; }
      room.tenantId = t.id; room.status = 'Terisi';
    }
    saveState(); closeModal(); toast('Data ' + nama + ' diperbarui.'); render(); return;
  }
  const t = {
    id: 'T' + String(DB.tenants.length + 1).padStart(2, '0'), propertyId: 'P1', nama, jk: 'L',
    telepon: val('ft-telepon'), email: val('ft-email') || nama.toLowerCase().split(' ')[0] + '@mail.com',
    pekerjaan: val('ft-pekerjaan'), darurat: val('ft-darurat'), ktp: val('ft-ktp'),
    roomId, masuk: val('ft-masuk', iso(NOW)), keluar: null, deposit: num('ft-deposit') || sewa, sewa,
    status: 'Aktif', arsip: false, pass: 'penghuni', catatan: '',
  };
  DB.tenants.push(t);
  DB.users.push({ id: 'U-' + t.id, nama: t.nama, email: t.email, pass: 'penghuni', role: 'tenant', tenantId: t.id });
  room.tenantId = t.id; room.status = 'Terisi';
  const durasi = num('ft-durasi', 12);
  DB.contracts.push({
    id: 'KTR-' + String(DB.contracts.length + 1).padStart(3, '0'), propertyId: 'P1', tenantId: t.id, roomId,
    mulai: t.masuk, akhir: iso(addMonths(D(t.masuk), durasi)), sewa, deposit: t.deposit, durasi,
    status: 'Menunggu Tanda Tangan', ttdPenghuni: false, ttdTanggal: null, aturan: null, tambahan: '',
  });
  const jatuh = new Date(D(t.masuk).getFullYear(), D(t.masuk).getMonth(), DB.settings.jatuhTempo);
  DB.invoices.push({
    id: 'INV-' + periodOf(t.masuk).replace('-', '') + '-' + String(DB.invoices.length + 1).padStart(3, '0'),
    propertyId: 'P1', tenantId: t.id, roomId, periode: periodOf(t.masuk), jatuhTempo: iso(jatuh), sewa,
    tambahan: [], diskon: 0, total: sewa, status: 'Menunggu', dibayar: 0, tanggalBayar: null, metode: null, denda: 0,
  });
  logAct(nama + ' ditambahkan ke kamar ' + room.nomor);
  refreshStatuses(); closeModal();
  toast(nama + ' ditambahkan. Kontrak dan tagihan pertama sudah dibuat.');
  render();
}

function simpanKontrak(id) {
  const tenantId = val('fk-tenant');
  const t = tenantOf(tenantId); if (!t) { toast('Pilih penghuni terlebih dahulu.', 'bad'); return; }
  const durasi = num('fk-durasi', 12);
  const mulai = val('fk-mulai', iso(NOW));
  const sewa = num('fk-sewa') || t.sewa;
  if (id) {
    const c = byId(DB.contracts, id);
    const base = D(c.akhir) > NOW ? c.akhir : mulai;
    c.mulai = base; c.akhir = iso(addMonths(D(base), durasi)); c.durasi = durasi; c.sewa = sewa;
    c.deposit = num('fk-deposit') || c.deposit; c.tambahan = val('fk-tambahan'); c.status = 'Aktif';
    t.sewa = sewa;
    logAct('Kontrak ' + c.id + ' diperpanjang sampai ' + fdate(c.akhir));
    refreshStatuses(); closeModal(); toast('Kontrak diperpanjang sampai ' + fdate(c.akhir) + '.'); render(); return;
  }
  const c = {
    id: 'KTR-' + String(DB.contracts.length + 1).padStart(3, '0'), propertyId: 'P1', tenantId, roomId: t.roomId,
    mulai, akhir: iso(addMonths(D(mulai), durasi)), sewa, deposit: num('fk-deposit') || sewa, durasi,
    status: 'Menunggu Tanda Tangan', ttdPenghuni: false, ttdTanggal: null, aturan: null, tambahan: val('fk-tambahan'),
  };
  DB.contracts.push(c);
  saveState(); closeModal(); toast('Kontrak dibuat dan menunggu tanda tangan penghuni.'); render();
}

function kirimTiket() {
  const judul = val('fti-judul').trim();
  if (!judul) { toast('Judul masalah wajib diisi.', 'bad'); return; }
  const isOwner = UI.session.role === 'owner';
  const roomId = isOwner ? val('fti-room') : me().roomId;
  const room = roomOf(roomId);
  const t = {
    id: 'TKT-' + String(DB.tickets.length + 1).padStart(3, '0'), propertyId: 'P1',
    tenantId: isOwner ? (room ? room.tenantId : null) : UI.session.tenantId, roomId,
    kategori: val('fti-kategori'), judul, deskripsi: val('fti-deskripsi'), prioritas: val('fti-prioritas'),
    status: 'Baru', teknisi: null, dilaporkan: iso(NOW), dimulai: null, diselesaikan: null,
    biaya: 0, resolusi: '', catatan: '', foto: ['Foto dari penghuni'], fotoSesudah: [], sparepart: '',
  };
  DB.tickets.unshift(t);
  logAct('Laporan baru ' + t.id + ' — ' + judul);
  saveState(); closeModal();
  toast('Laporan terkirim. Nomor tiket Anda ' + t.id + '.');
  render();
}

function simpanTiket(id) {
  const t = byId(DB.tickets, id); if (!t) return;
  const statusBaru = val('ftk-status', t.status);
  const part = val('ftk-part');
  t.teknisi = val('ftk-teknisi') || null;
  t.biaya = num('ftk-biaya', t.biaya);
  t.resolusi = val('ftk-resolusi', t.resolusi);
  if (statusBaru !== t.status) {
    if (statusBaru === 'Dikerjakan' && !t.dimulai) t.dimulai = iso(NOW);
    if (statusBaru === 'Selesai') { t.diselesaikan = iso(NOW); t.fotoSesudah = ['Foto setelah perbaikan']; }
    t.status = statusBaru;
  }
  if (part) {
    const it = byId(DB.inventory, part);
    if (it && it.jumlah > 0) {
      it.jumlah -= 1;
      DB.invTx.unshift({ id: uid('TX'), itemId: it.id, jenis: 'Keluar', jumlah: 1, tanggal: iso(NOW), ref: t.id, catatan: 'Dipakai untuk ' + t.judul });
      if (stockStatus(it) !== 'Tersedia') toast('Stok ' + it.nama + ' tinggal ' + it.jumlah + ' ' + it.satuan + '.', 'warn');
    }
  }
  logAct('Tiket ' + t.id + ' diperbarui menjadi ' + t.status);
  saveState(); closeModal();
  toast('Laporan diperbarui' + (t.status === 'Selesai' ? '. Penghuni diminta memberi penilaian.' : '.'));
  render();
}

/* ---------------- Mulai ---------------- */
(function init() {
  const saved = loadState();
  DB = saved || seedDB();
  DB.notifRead = DB.notifRead || [];
  refreshStatuses();
  render();
})();

</script>
</body>
</html>
